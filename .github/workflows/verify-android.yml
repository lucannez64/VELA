name: verify-android

# Build-only check for the Android app: no GitHub release is created, and
# release-signing secrets are never touched (always builds the debug variant).
# Mirrors release-android.yml's build steps but stops before publishing, so —
# unlike release-android.yml, which is push:main/workflow_dispatch only — this
# is safe to run on pull requests and arbitrary branches, including PRs whose
# base isn't `main`.

on:
  pull_request:
    paths:
      - "androidVELA/**"
      - "libVELA/vela-android-bridge/**"
      - "libVELA/vela-crypto/**"
      - "libVELA/vela-sync-policy/**"
      - ".github/workflows/verify-android.yml"
  workflow_dispatch:

env:
  NDK_VERSION: "26.3.11579264"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # `tools` was removed from the SDK repository, but setup-android's
          # default package list still includes it, so "sdkmanager tools" now
          # fails before anything builds. Pin the packages we actually need.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: libVELA/vela-android-bridge

      - name: Build debug APK (no signing secrets, no release)
        working-directory: androidVELA
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # The JVM unit tests existed but nothing ran them, so a green PR proved
      # only that the app compiled. They cover the vault JSON round-trip, the
      # password-protected RMS store, and the autofill unlock tokens that keep
      # an exported activity from handing credentials to any caller (audit A-1).
      - name: Run unit tests
        working-directory: androidVELA
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # The release build is the only one that runs R8, and a missing keep rule
      # shows up as a crash on a user's phone rather than a build failure — so
      # exercise it here. `velaAllowDebugSigning` is the documented opt-out for
      # builds with no keystore, which is every PR (audit A-3).
      - name: Build release APK (exercises R8 shrinking + keep rules)
        working-directory: androidVELA
        run: |
          ./gradlew :app:assembleRelease -PvelaAllowDebugSigning=true \
            --no-daemon --stacktrace
