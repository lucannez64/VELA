name: extension-release

# Build the browser extension (Chromium + Gecko variants) and publish a GitHub
# release carrying the Firefox XPI and a Chromium zip on every push to main.
# When AMO credentials are configured (repo secrets WEB_EXT_API_KEY /
# WEB_EXT_API_SECRET), the Firefox build is additionally submitted to AMO for
# signing and the *signed* add-on is what ships. PRs build and test only:
# signing their synthetic merge commit would consume the version that the
# subsequent main push needs.
#
# Mirrors release-desktop/release-android: the version is derived from the
# commit (patch = commit count, monotonic and unique), and the short SHA is
# recorded in the release for traceability.
#
# PRs and arbitrary branches are a dry run: they build both variants and run
# the WebAuthn shim regression test, but never publish or sign.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # AMO credentials, mapped to job env so step `if:` can test their presence
    # (the `secrets` context is not available inside `if:` conditions).
    env:
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for `git rev-list --count`

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: extension
        run: bun install

      - name: Build extension (chrome + firefox + XPI)
        working-directory: extension
        run: bun run build

      # The WebAuthn shim must keep returning objects that pass
      # `instanceof PublicKeyCredential` — a regression here silently breaks
      # every relying party that type-checks the result.
      - name: Run WebAuthn shim regression test
        working-directory: extension
        run: bun test:shim

      - name: Package Chromium build for "Load unpacked"
        working-directory: extension/dist
        run: zip -r ../vela-chrome.zip chrome

      - name: Derive version from commit
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          VERSION="0.1.$COUNT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=extension-v$VERSION" >> "$GITHUB_OUTPUT"

      # AMO rejects a re-submitted version, so stamp the commit-derived version
      # into the built Firefox manifest before signing — each main release gets
      # a unique version. Only runs on a main push when the AMO secrets are
      # configured.
      - name: Stamp version into the Firefox build (for signing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        working-directory: extension
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" \
            '.version = $v' dist/firefox/manifest.json > tmp.json \
            && mv tmp.json dist/firefox/manifest.json

      - name: Submit to AMO for signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        working-directory: extension
        run: |
          set -euo pipefail
          npx web-ext sign --source-dir dist/firefox \
            --artifacts-dir dist/signed --channel unlisted --no-input

      # Publishing is main-only. Ships the AMO-signed add-on when one was
      # produced, otherwise the unsigned XPI (dev/nightly / unsigned-allowed
      # profiles). The version is unique per commit, so re-runs that collide
      # with an existing tag just re-upload the assets.
      - name: Publish Firefox add-on + Chromium zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          SHA="${{ steps.version.outputs.sha }}"
          TAG="${{ steps.version.outputs.tag }}"
          SIGNED=""
          if ls dist/signed/* >/dev/null 2>&1; then
            SIGNED="$(ls -t dist/signed/* | head -1)"
          fi
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" dist/signed/vela-firefox-signed.xpi
            FIREFOX_ASSET="dist/signed/vela-firefox-signed.xpi"
            FIREFOX_LABEL="AMO-signed Firefox add-on"
          else
            FIREFOX_ASSET="dist/vela-firefox.xpi"
            FIREFOX_LABEL="unsigned Firefox XPI (dev/nightly / unsigned-allowed profiles)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" vela-chrome.zip "$FIREFOX_ASSET" --clobber
          else
            gh release create "$TAG" \
              --title "VELA Extension v$VER" \
              --notes "Built from \`$SHA\`.
              - \`vela-chrome.zip\` — unzip and **Load unpacked** in any Chromium browser.
              - \`$FIREFOX_ASSET\` — $FIREFOX_LABEL." \
              vela-chrome.zip "$FIREFOX_ASSET"
          fi
