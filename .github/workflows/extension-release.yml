name: extension-release

# Build the browser extension (Chromium + Gecko variants) and publish a GitHub
# release carrying the Firefox XPI and a Chromium zip on every push to main.
#
# Mirrors release-desktop/release-android: the version is derived from the
# commit (patch = commit count, monotonic and unique), and the short SHA is
# recorded in the release for traceability.
#
# PRs and arbitrary branches are a dry run: they build both variants and run
# the WebAuthn shim regression test, but never publish — so a green PR proves
# the extension compiles, and the publishing step only ever runs on main.
#
# The published XPI is the unsigned build (useful in dev/nightly or
# unsigned-allowed profiles). It is not AMO-signed automatically: signing needs
# AMO credentials, which are gate-kept behind the version:bump + sign:firefox
# step and are deliberately not wired into this automated release.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for `git rev-list --count`

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: extension
        run: bun install

      - name: Build extension (chrome + firefox + XPI)
        working-directory: extension
        run: bun run build

      # The WebAuthn shim must keep returning objects that pass
      # `instanceof PublicKeyCredential` — a regression here silently breaks
      # every relying party that type-checks the result.
      - name: Run WebAuthn shim regression test
        working-directory: extension
        run: bun test:shim

      - name: Package Chromium build for "Load unpacked"
        working-directory: extension/dist
        run: zip -r ../vela-chrome.zip chrome

      - name: Derive version from commit
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          VERSION="0.1.$COUNT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=extension-v$VERSION" >> "$GITHUB_OUTPUT"

      # Publishing is main-only: the version is unique per commit, so re-runs
      # that collide with an existing tag just re-upload the assets.
      - name: Publish Firefox XPI + Chromium zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          SHA="${{ steps.version.outputs.sha }}"
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/vela-firefox.xpi vela-chrome.zip --clobber
          else
            gh release create "$TAG" \
              --title "VELA Extension v$VER" \
              --notes "Built from \`$SHA\`.
              - \`vela-firefox.xpi\` — the Firefox/Gecko build. Install in a dev/nightly or unsigned-allowed profile (not AMO-signed by this automated release).
              - \`vela-chrome.zip\` — unzip and **Load unpacked** in any Chromium browser." \
              dist/vela-firefox.xpi vela-chrome.zip
          fi
