name: proof-image

# Builds the VELA proof container (assurance T11) and publishes it to
# ghcr.io/lucannez64/vela-proof, then exercises it: the symbolic/computational
# gates run `run-all.sh` inside the image, and the hax/F* gates run the same
# per-crate scripts `run-all.sh --with-fstar` runs.
#
# The published digest is what security.yml reads from
# security/assurance/proof-image/IMAGE. Two-phase bootstrap:
#   1. this workflow builds and pushes the image, and prints its digest in the
#      job summary (IMAGE still holds the placeholder, so security.yml's
#      hosted proof jobs keep their host installs);
#   2. after the first build the owner writes that digest into IMAGE, and the
#      hosted proof jobs switch to `container:` on the next run.
# See security/assurance/proof-image/README.md.
#
# Why the verification is split: `run-all.sh --with-fstar` re-extracts and
# re-checks nine crates sequentially. That does not fit in the 360-minute
# hosted job cap, so the symbolic/statistical half runs as one job and the
# nine F* run_steps run as one matrix, together covering every run_step of
# `run-all.sh --with-fstar` (the per-crate scripts are exactly the commands the
# runner invokes).

on:
  push:
    branches: ["**"]
    paths:
      - "security/assurance/proof-image/**"
      - "security/assurance/opam-lock/**"
      - "security/assurance/install-hax.sh"
      - "security/assurance/install-formal-fstar.sh"
      - ".github/workflows/proof-image.yml"
      # Writing the published digest into IMAGE (or editing the README) must
      # not rebuild the image: a rebuild yields a new digest.
      - "!security/assurance/proof-image/IMAGE"
      - "!security/assurance/proof-image/README.md"
  workflow_dispatch:
    inputs:
      digest:
        description: "Verify this already-published sha256:... digest instead of building"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lucannez64/vela-proof

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      digest: ${{ inputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the requested digest (verify-only dispatch)
        if: inputs.digest != ''
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "verifying the published image $IMAGE@$DIGEST without a rebuild"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: inputs.digest == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (tag = git sha)
        if: inputs.digest == ''
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: security/assurance/proof-image/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Print the image digest in the job summary
        if: inputs.digest == ''
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          {
            echo '### VELA proof image'
            echo
            echo 'Published by `proof-image.yml`. To switch the hosted proof jobs'
            echo 'to this image, set `security/assurance/proof-image/IMAGE` to:'
            echo
            echo '```'
            printf '%s@%s\n' "$IMAGE" "$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'built %s@%s\n' "$IMAGE" "$digest"

  # run-all.sh without --with-fstar: correspondence, the share journal,
  # network boundaries, the M1-M10 credential-release ladder, every Tamarin
  # family, ProVerif/ORAM and the statistical stash bounds. The F* run_steps
  # are the next job.
  verify-symbolic:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Job containers default to `sh`; the steps use bash (pipefail, [[ ]]).
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ghcr.io/lucannez64/vela-proof@${{ needs.build.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # bounded.sh needs a systemd user manager, absent from the job container;
      # the hosted runner's own memory bound applies instead.
      VELA_BOUNDED: "1"
      VELA_CARGO_JOBS: "4"
      VELA_MEMORY_MAX: "10G"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the image's pinned toolchain
        run: |
          set -euo pipefail
          tamarin-prover --version
          maude --version
          proverif -help 2>&1 | head -1
          fstar.exe --version
          z3-4.13.3 --version
          python3 --version
          cargo hax --version | grep -Fx 'version=0.3.7'

      - name: Run every symbolic and computational gate in the image
        run: security/assurance/run-all.sh --out "$RUNNER_TEMP/assurance-logs"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proof-image-symbolic-logs
          path: ${{ runner.temp }}/assurance-logs

  # The nine hax/F* run_steps of `run-all.sh --with-fstar`, one job each.
  verify-refinement:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # Job containers default to `sh`; the steps use bash (pipefail, [[ ]]).
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ghcr.io/lucannez64/vela-proof@${{ needs.build.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fstar-vela-rekey-policy, dir: serverVELA/vela-rekey-policy, script: verify-fstar.sh }
          - { name: fstar-vela-session-policy, dir: serverVELA/vela-session-policy, script: verify-fstar.sh }
          - { name: fstar-vela-enrollment-policy, dir: serverVELA/vela-enrollment-policy, script: verify-fstar.sh }
          - { name: fstar-vela-recovery-policy, dir: serverVELA/vela-recovery-policy, script: verify-fstar.sh }
          - { name: fstar-vela-share-policy, dir: serverVELA/vela-share-policy, script: verify-fstar.sh }
          - { name: fstar-vela-client-recovery-policy, dir: libVELA/vela-client-recovery-policy, script: verify-fstar.sh }
          - { name: fstar-vela-sync-policy, dir: libVELA/vela-sync-policy, script: verify-fstar.sh }
          - { name: fstar-vela-client-share-policy, dir: libVELA/vela-client-share-policy, script: verify-fstar.sh }
          - { name: share-facts-fstar, dir: libVELA/vela-crypto, script: verify-share-facts-fstar.sh }
    env:
      # bounded.sh needs a systemd user manager; the runner VM bounds memory.
      VELA_BOUNDED: "1"
      VELA_CARGO_JOBS: "4"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract and check ${{ matrix.name }}
        env:
          CRATE_DIR: ${{ matrix.dir }}
          SCRIPT: ${{ matrix.script }}
          LOG_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refinement-logs"
          # Require fresh output even when the repository ships extractions.
          if [[ -d "$CRATE_DIR/proofs/fstar/extraction" ]]; then
            find "$CRATE_DIR/proofs/fstar/extraction" -maxdepth 1 -type f \( -name '*.fst' -o -name '*.fsti' \) -delete
          fi
          log="$RUNNER_TEMP/refinement-logs/$LOG_NAME.log"
          if ! "$CRATE_DIR/$SCRIPT" > "$log" 2>&1; then
            tail -n 100 "$log"
            exit 1
          fi

      - name: Collect checked extractions
        if: always()
        env:
          CRATE_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.proof-out/extractions"
          mkdir -p "$out" .proof-out/logs
          cp -r "$RUNNER_TEMP/refinement-logs/." .proof-out/logs/ 2>/dev/null || true
          find "$CRATE_DIR/proofs/fstar" -type f -name '*.fst' \
            \( -path '*/extraction/*' -o -path '*/extraction-*' -o -path '*-lemmas/*' -o -path '*-composition/*' -o -path '*/models/*' \) \
            -exec cp --parents {} "$out" \; 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proof-image-logs-${{ matrix.name }}
          path: .proof-out/logs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proof-image-extractions-${{ matrix.name }}
          path: .proof-out/extractions

  # The final `proof-boundary` run_step, over the extractions the matrix just
  # regenerated.
  verify-boundary:
    needs: [build, verify-refinement]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Job containers default to `sh`; the steps use bash (pipefail, [[ ]]).
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ghcr.io/lucannez64/vela-proof@${{ needs.build.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require every extraction job to pass
        env:
          RESULT: ${{ needs.verify-refinement.result }}
        run: test "$RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: proof-image-extractions-*
          merge-multiple: true
          path: .
      - name: Audit extraction assumptions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/boundary-logs"
          python3 security/assurance/check-proof-boundary.py | tee "$RUNNER_TEMP/boundary-logs/proof-boundary.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proof-image-logs-boundary
          path: ${{ runner.temp }}/boundary-logs
