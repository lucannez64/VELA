name: release-desktop

# Build the native GPUI desktop app for Windows and Linux, and publish a GitHub
# release carrying the MSI (WiX), the NSIS setup .exe, the .deb and the .rpm.
# The version is derived from the commit: patch = number of commits on the
# branch, so it is monotonic and unique, and the short SHA is recorded in the
# release name/body for traceability.
#
# A third job keeps the AUR package `vela-desktop-bin` in sync: it rewrites
# the PKGBUILD with the new version + .deb checksum and pushes it to the AUR
# (requires the AUR_SSH_PRIVATE_KEY repository secret; skipped otherwise).
on:
  workflow_dispatch:
  # PRs build and package both desktop targets but skip every publishing step.
  # This keeps the first execution of a packaging path from being the one that
  # ships to users.
  pull_request:
    branches: [main]
    paths:
      - "desktopVELA/**"
      - "libVELA/vela-crypto/**"
      - ".github/workflows/release-desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktopVELA/**"
      - "libVELA/vela-crypto/**"
      - ".github/workflows/release-desktop.yml"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for `git rev-list --count`

      - name: Derive version from commit
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          VERSION="0.1.$COUNT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version into the GPUI crate
        shell: bash
        run: |
          sed -i '0,/^version = ".*"$/s//version = "${{ steps.version.outputs.version }}"/' \
            desktopVELA/src-gpui/Cargo.toml
          grep -m1 '^version' desktopVELA/src-gpui/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktopVELA -> ../target
          # The repo-root .cargo/config.toml redirects the target dir to
          # VELA/target. Cache the vendored gpui-ce artifacts too: rust-cache
          # treats every
          # crate *inside* the workspace dir as a "workspace crate" and skips
          # caching them by default - vendor/gpui-ce lives under desktopVELA/,
          # so its whole debug + release output was rebuilt on every run.
          cache-workspace-crates: true
          # New cache contents (gpui-ce now included) need a new key: rust-cache
          # refuses to re-save when the restore key already matched, so the
          # first run after this is cold and every later one is fast.
          prefix-key: v1-rust
          shared-key: desktop-windows
          # A failed or cancelled build otherwise saves nothing, so the next
          # attempt starts cold too — exactly when iterating on a broken build
          # is already painful. rust-cache only stores dependency artifacts and
          # cleans the workspace's own, so a failure cannot poison it.
          cache-on-failure: true

      - name: Test GPUI frontend
        working-directory: desktopVELA
        run: cargo test -p vela-desktop-gpui

      - name: Build GPUI app and native-messaging host
        working-directory: desktopVELA
        run: cargo build --release -p vela-desktop-gpui -p vela-nm-host

      # cargo-packager is framework-neutral and produces the same two Windows
      # installer formats without compiling or embedding the Tauri/WebView UI.
      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Build MSI + NSIS from the GPUI binary
        working-directory: desktopVELA/src-gpui
        run: cargo packager --release --formats nsis,wix

      - name: Normalise artifact names
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $msi = Get-ChildItem target -Recurse -Filter '*.msi' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $setup = Get-ChildItem target -Recurse -Filter '*.exe' |
            Where-Object Name -Like '*setup*' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi -or -not $setup) {
            throw 'cargo-packager did not produce both Windows installers'
          }
          New-Item -ItemType Directory -Force desktopVELA/dist | Out-Null
          Copy-Item $msi.FullName "desktopVELA/dist/VELA_${version}_x64_en-US.msi"
          Copy-Item $setup.FullName "desktopVELA/dist/VELA_${version}_x64-setup.exe"

      - name: Upload installers as build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vela-windows-installers
          path: desktopVELA/dist/*
          if-no-files-found: error

      - name: Upload installers to the release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "VELA Desktop v${{ steps.version.outputs.version }}" \
              --notes "Automated desktop build.

          - Commit: ${{ github.sha }} (\`${{ steps.version.outputs.sha }}\`)
          - Windows: \`.msi\` (WiX) and \`-setup.exe\` (NSIS), native gpui-ce build
          - Linux: \`.deb\` and \`.rpm\`, native gpui-ce build"
          gh release upload "$TAG" desktopVELA/dist/* --clobber

  # Linux also ships the native gpui-ce build, retaining its existing tray,
  # XDG portal global shortcut, autofill IPC, and secret-service integration.
  #
  # The binary installs as `vela-desktop` so the desktop entry, icon name, WM
  # class, portal app id and AUR package are all unchanged from the Tauri
  # build; `update-aur` below therefore needs no changes at all.
  build-linux:
    runs-on: ubuntu-latest
    env:
      # Content-hash compilation cache (mozilla-actions/sccache-action below).
      # This is what actually fixes the vendored-gpui-ce rebuild problem:
      # cargo freshness-checks path dependencies by file mtime, and every
      # checkout stamps fresh mtimes, so artifact caches alone cannot stop
      # the vendor tree from recompiling. sccache keys on source content, so
      # unchanged crates are cache hits regardless of mtimes.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Derive version from commit
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          VERSION="0.1.$COUNT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

      # gpui-ce needs no WebKitGTK. Wayland/X11 windowing, font rendering,
      # xkb keymaps and udev device enumeration are the real requirements;
      # libssl/libudev come from the vault's own dependency chain.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libwayland-dev \
            libudev-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktopVELA -> ../target
          # Cache the vendored gpui-ce artifacts too. rust-cache treats every
          # crate *inside* the workspace dir as a "workspace crate" and skips
          # caching them by default - vendor/gpui-ce lives under desktopVELA/,
          # so its whole debug + release output was rebuilt on every run.
          cache-workspace-crates: true
          # New cache contents (gpui-ce now included) need a new key: rust-cache
          # refuses to re-save when the restore key already matched, so the
          # first run after this is cold and every later one is fast.
          prefix-key: v1-rust
          cache-on-failure: true

      # The main place the desktop crates' tests run: the macOS job compiles
      # a different set of `cfg`s entirely (none of `linux_biometric`, the
      # portal client or the IPC server), so a Linux-only regression can only
      # be caught here. Runs core + the gpui binary's tests, plus the headless
      # end-to-end sync tests in vela-e2e (desktop client <-> mock server <->
      # android client, all in-process); the src-tauri package's tests need the
      # frontend `dist/` and run in the macOS job.
      - name: Test
        working-directory: desktopVELA
        env:
          # Runners have no session bus. Point at one that cannot exist so the
          # Secret Service probes fail fast and deterministically instead of
          # waiting on autolaunch — they only have to *not panic*.
          DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent
        run: cargo test -p vela-desktop-core -p vela-desktop-gpui -p vela-e2e

      # React renderer unit tests (vitest) — the frontend has its own test
      # suite under desktopVELA/src.
      - uses: oven-sh/setup-bun@v2

      - name: Test frontend
        working-directory: desktopVELA
        run: |
          bun install
          bun run lint
          bun run test

      # Not a general clippy gate (the tree has pre-existing warnings) — just
      # the runtime-coupling guard from clippy.toml, which turns "panics on a
      # machine none of us has" into a red PR. See that file for the why.
      - name: Lint (runtime-coupling guard)
        working-directory: desktopVELA
        run: |
          cargo clippy --all-targets \
            -p vela-desktop-core -p vela-desktop-gpui -p vela-e2e \
            -- -D clippy::disallowed_methods

      - name: Stamp version into the gpui crate
        working-directory: desktopVELA
        run: |
          sed -i '0,/^version = ".*"$/s//version = "${{ steps.version.outputs.version }}"/' \
            src-gpui/Cargo.toml
          grep -m1 '^version' src-gpui/Cargo.toml

      - name: Build (release)
        working-directory: desktopVELA
        run: cargo build --release -p vela-desktop-gpui

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package .deb and .rpm
        working-directory: desktopVELA/src-gpui
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          # --no-build/--no-strip: reuse the release binary built above rather
          # than triggering a second compile of the whole gpui tree.
          cargo deb --no-build --output ../target/debian/
          # cargo-deb creates its output dir, cargo-generate-rpm does not — it
          # fails with a misleading "Is a directory" if this is missing.
          mkdir -p ../target/generate-rpm
          cargo generate-rpm --output ../target/generate-rpm/

      # Match the filenames the Windows job and update-aur expect.
      - name: Normalise artifact names
        id: artifacts
        working-directory: desktopVELA
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp "$(ls target/debian/*.deb | head -1)" "dist/VELA_${V}_amd64.deb"
          cp "$(ls target/generate-rpm/*.rpm | head -1)" "dist/VELA-${V}-1.x86_64.rpm"
          ls -l dist

      # Dry run: prove the .deb/.rpm build and are inspectable, publish nothing.
      - name: Upload packages as build artifacts (PR dry run)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vela-linux-packages
          path: desktopVELA/dist/*

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # The Windows job may have created the release already; create it
          # only if missing, then attach (clobbering a re-run's leftovers).
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "VELA Desktop v${{ steps.version.outputs.version }}" \
              --notes "Automated desktop build.

          - Commit: ${{ github.sha }} (\`${{ steps.version.outputs.sha }}\`)
          - Windows: \`.msi\` (WiX) and \`-setup.exe\` (NSIS), native gpui-ce build
          - Linux: \`.deb\` and \`.rpm\`, native gpui-ce build"
          gh release upload "$TAG" desktopVELA/dist/* --clobber

  update-aur:
    # Keep the AUR package vela-desktop-bin in sync with the release.
    # Skipped gracefully until the AUR_SSH_PRIVATE_KEY secret is configured.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    env:
      AUR_PACKAGE: vela-desktop-bin
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether AUR publishing is configured
        id: aur
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY secret not set — skipping AUR update"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive version from commit
        if: steps.aur.outputs.enabled == 'true'
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          VERSION="0.1.$COUNT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

      # pacman-package-manager provides makepkg, used to regenerate .SRCINFO.
      - name: Install makepkg
        if: steps.aur.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager

      - name: Download the released .deb and checksum it
        if: steps.aur.outputs.enabled == 'true'
        id: deb
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --pattern "VELA_${{ steps.version.outputs.version }}_amd64.deb" \
            --dir /tmp/aur-dl --clobber
          SUM=$(sha256sum "/tmp/aur-dl/VELA_${{ steps.version.outputs.version }}_amd64.deb" | awk '{print $1}')
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"

      - name: Configure SSH for the AUR
        if: steps.aur.outputs.enabled == 'true'
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # The AUR takes itself down for maintenance every so often. The release
      # artifacts are already published by this point, so an unreachable AUR
      # must not fail the run: retry a few times, then warn and skip. The next
      # release picks the package back up.
      - name: Clone the AUR package
        if: steps.aur.outputs.enabled == 'true'
        id: clone
        run: |
          for attempt in 1 2 3 4 5; do
            if timeout 120 git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" aur; then
              echo "cloned=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -rf aur
            if [ "$attempt" -lt 5 ]; then
              DELAY=$((attempt * 30))
              echo "AUR clone attempt $attempt failed; retrying in ${DELAY}s"
              sleep "$DELAY"
            fi
          done
          echo "::warning::AUR unreachable after 5 attempts (maintenance?) — skipping the AUR update for this release"
          echo "cloned=false" >> "$GITHUB_OUTPUT"

      # Pushing this commit to the AUR creates the package if it does not
      # exist yet (as long as the name is available and the key's account
      # owns it), and updates it otherwise.
      - name: Update PKGBUILD and push to AUR
        if: steps.aur.outputs.enabled == 'true' && steps.clone.outputs.cloned == 'true'
        run: |
          set -e
          cd aur

          cat > PKGBUILD <<EOF
          # Maintainer: VELA <https://github.com/lucannez64/VELA>
          pkgname=${AUR_PACKAGE}
          pkgver=${{ steps.version.outputs.version }}
          pkgrel=1
          pkgdesc="Passwordless, zero-knowledge vault desktop app (prebuilt binary)"
          arch=('x86_64')
          url="https://github.com/lucannez64/VELA"
          license=('custom')
          depends=('cairo' 'desktop-file-utils' 'gdk-pixbuf2' 'glib2' 'gtk3'
                   'hicolor-icon-theme' 'libsoup3' 'pango' 'webkit2gtk-4.1'
                   'libayatana-appindicator' 'librsvg')
          optdepends=('gnome-keyring: system secret-storage backend'
                      'keepassxc: alternative secret-storage backend'
                      'fprintd: fingerprint unlock and fill confirmation')
          provides=('vela-desktop')
          conflicts=('vela-desktop')
          # Prebuilt binary: upstream already stripped it — re-stripping is
          # useless and the split -debug package would only contain junk.
          options=('!strip' '!debug')
          source_x86_64=("VELA_\${pkgver}_amd64.deb::\${url}/releases/download/desktop-v\${pkgver}/VELA_\${pkgver}_amd64.deb")
          sha256sums_x86_64=('${{ steps.deb.outputs.sha256 }}')

          package() {
            ar x "VELA_\${pkgver}_amd64.deb"
            tar -xf data.tar.* -C "\${pkgdir}"
          }
          EOF

          makepkg --printsrcinfo > .SRCINFO

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already up to date"
            exit 0
          fi

          git commit -m "Update to ${{ steps.version.outputs.version }}"
          for attempt in 1 2 3; do
            if timeout 120 git push; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              DELAY=$((attempt * 30))
              echo "AUR push attempt $attempt failed; retrying in ${DELAY}s"
              sleep "$DELAY"
            fi
          done
          echo "::warning::Could not push to the AUR — skipping the AUR update for this release"
