name: verify-server

# Build-only check for the server Docker image: no registry push, no Coolify
# deploy trigger. Mirrors build-server.yml's build step but stops before
# publishing, so — unlike build-server.yml — this is safe to run on pull
# requests and arbitrary branches, including PRs whose base isn't `main`
# (build-server.yml only fires on push:main, so it never runs as a PR check).

on:
  pull_request:
    paths:
      - "serverVELA/**"
      - "libVELA/vela-crypto/**"
      - "libVELA/vela-sync-policy/**"
      - "libVELA/vela-core/**"
      - "libVELA/vela-wasm-bridge/**"
      - "webVELA/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/verify-server.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vela-server:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
