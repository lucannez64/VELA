name: desktop-macos

# Build + systematically verify the desktop app on real macOS (Apple Silicon),
# since it can't be built or tested off a Mac. Runs automatically on
# desktop-related changes (repo is public -> macOS minutes are free) and on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktopVELA/**"
      - "libVELA/vela-crypto/**"
      - "extension/native-messaging/**"
      - ".github/workflows/desktop-macos.yml"
      - ".github/scripts/ipc_ping.py"
  pull_request:
    branches: [main]
    paths:
      - "desktopVELA/**"
      - "libVELA/vela-crypto/**"
      - "extension/native-messaging/**"
      - ".github/workflows/desktop-macos.yml"
      - ".github/scripts/ipc_ping.py"

# One run per ref; cancel superseded in-progress runs to avoid pile-ups.
concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    permissions:
      contents: read
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          # desktopVELA, not src-tauri: src-tauri is a workspace member now, so
          # the lockfile and target dir it caches both live at the root. Pointed
          # at src-tauri it keys off an orphaned lockfile and caches an empty
          # target dir.
          workspaces: desktopVELA -> ../target
          # The repo-root .cargo/config.toml redirects the target dir to
          # VELA/target, so point rust-cache at it (cache-dir is relative to
          # the workspace dir).
          # Cache the vendored gpui-ce artifacts too. rust-cache treats every
          # crate *inside* the workspace dir as a "workspace crate" and skips
          # caching them by default - vendor/gpui-ce lives under desktopVELA/,
          # so its whole debug + release output was rebuilt on every run.
          cache-workspace-crates: true
          # New cache contents (gpui-ce now included) need a new key: rust-cache
          # refuses to re-save when the restore key already matched, so the
          # first run after this is cold and every later one is fast.
          prefix-key: v1-rust

      - name: Install frontend deps
        working-directory: desktopVELA
        run: bun install

      # tauri::generate_context! (compiled by `cargo test`) reads frontendDist
      # (../dist), so the frontend must be built before the Rust step.
      - name: Build frontend
        working-directory: desktopVELA
        run: bun run build

      # Verify the macOS-specific Rust paths actually compile and pass on macOS
      # (keychain/Touch ID/default_password code that's never built off a Mac).
      - name: Rust tests (macOS code paths)
        working-directory: desktopVELA/src-tauri
        run: cargo test --release

      # Build the .app/.dmg (runs beforeBuildCommand `bun run build` -> tsc+vite).
      - name: Build macOS app bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktopVELA

      # Launch the built app on the runner, screenshot it, and confirm it didn't
      # crash on startup. The screenshot is uploaded so the UI can be eyeballed.
      # Bundles land in the shared repo-root target (see .cargo/config.toml), not src-tauri/target: src-tauri is a
      # member of the desktopVELA workspace, so the target dir is the workspace
      # root's.
      - name: Smoke test (launch, screenshot, extension IPC bridge)
        run: |
          set -x
          APP=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "no .app bundle found"; ls -R target/release/bundle || true; exit 1; fi

          # The IPC connection gate reads VELA_NM_BROWSER_NAMES from the
          # *desktop's* environment (it runs in the server process), so the
          # variable must be set before the app starts — and `open` does not
          # pass shell env through launchd. Launch the binary directly so it
          # inherits this shell's environment.
          export VELA_NM_BROWSER_NAMES=bash
          APP_BIN=$(find "$APP/Contents/MacOS" -type f -perm -111 | head -1)
          if [ -z "$APP_BIN" ]; then echo "no executable in $APP/Contents/MacOS"; exit 1; fi
          "$APP_BIN" >/tmp/vela-app.log 2>&1 &
          sleep 12
          screencapture -x smoke.png || true
          if pgrep -f 'VELA.app/Contents/MacOS' >/dev/null; then
            echo "app is running after launch"
          else
            echo "app crashed on launch"; cat /tmp/vela-app.log || true; exit 1
          fi

          # Extension <-> desktop bridge: the desktop must be listening on the
          # well-known per-user endpoint, and the real compiled native-messaging
          # host (built with the rest of the workspace) must ping->pong it.
          # Option B (#149): no capability file exists any more; the gate
          # admits a host spawned by a browser. Nothing spawned CI from a
          # browser, so name a real ancestor executable for the smoke test
          # (exported above, before the app started, for exactly that reason).
          ENDPOINT=$(ls "$TMPDIR"/vela-*/desktop.sock /tmp/vela-*/desktop.sock 2>/dev/null | head -1)
          if [ -z "$ENDPOINT" ]; then echo "no desktop socket found under $TMPDIR or /tmp"; exit 1; fi
          echo "desktop socket: $ENDPOINT"
          # The workspace manifest lives in desktopVELA/, not the repo root.
          (cd desktopVELA && cargo build --release -p vela-nm-host)
          python3 .github/scripts/ipc_ping.py target/release/vela-native-messaging-host

          osascript -e 'quit app "VELA"' 2>/dev/null || pkill -f 'VELA.app' || true

      - name: Upload artifacts (app, dmg, screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vela-macos-arm64
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            smoke.png
          if-no-files-found: warn
