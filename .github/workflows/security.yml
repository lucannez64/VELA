name: security

# Project-specific security tooling (see SECURITY_AUDIT.md):
#   - static-scan : semgrep (extension JS), scan.py (Rust rules), cargo-audit,
#                   cargo-deny.
#   - regression  : live exploits against a fresh isolated loopback server
#                   (temp DATA_DIR, teardown via trap — never touches production).
#
# Gating status:
#   - both regression tests (web-session grant binding, IDOR/XFF defence) ARE
#     hard gates.
#   - static-scan IS a hard gate now: the findings it used to report (M4, L2,
#     E-1, E-2) are fixed, so a new one means a regression rather than a known
#     issue. Do not reintroduce continue-on-error to get a PR through.

on:
  pull_request:
    paths:
      - "security/**"
      - "serverVELA/**"
      - "libVELA/vela-crypto/**"
      - "libVELA/vela-*-policy/**"
      - "libVELA/vela-core/**"
      - "libVELA/vela-android-bridge/**"
      - "libVELA/vela-apple-bridge/**"
      - "libVELA/vela-wasm-bridge/**"
      - "desktopVELA/**"
      - "androidVELA/**"
      - "iosVELA/**"
      - "extension/src/**"
      - "Cargo.lock"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
  push:
    branches: ["main"]
    paths:
      - "security/**"
      - "serverVELA/**"
      - "libVELA/vela-crypto/**"
      - "libVELA/vela-*-policy/**"
      - "libVELA/vela-core/**"
      - "libVELA/vela-android-bridge/**"
      - "libVELA/vela-apple-bridge/**"
      - "libVELA/vela-wasm-bridge/**"
      - "desktopVELA/**"
      - "androidVELA/**"
      - "iosVELA/**"
      - "extension/src/**"
      - "Cargo.lock"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR and manual runs for the same branch share a slot; retain main's queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  formal-rekey:
    runs-on: ubuntu-latest
    env:
      # Compilation uses all runner cores; tests stay serial.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1

      # One workspace entry per cached target directory. On save, rust-cache
      # prunes each listed target down to that workspace's dependencies; listing
      # several workspaces that share one target keeps only the crates common
      # to all of them, which threw away the server's dependency tree and made
      # every run rebuild from scratch. The server builds into target/, the
      # libVELA crates into target-lib/ (CARGO_TARGET_DIR on those steps); the
      # Android bridge's dependency tree covers vela-crypto and the policies.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            serverVELA -> ../target
            libVELA/vela-android-bridge -> ../../target-lib
          shared-key: security-formal-v3

      - name: Install pinned Tamarin 1.12.0 and Maude 3.5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes ripgrep unzip libgmp10
          curl -fL -o /tmp/tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          echo "201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  /tmp/tamarin.tar.gz" | sha256sum -c
          sudo tar -xzf /tmp/tamarin.tar.gz -C /usr/local/bin
          curl -fL -o /tmp/maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          echo "72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  /tmp/maude.zip" | sha256sum -c
          sudo mkdir -p /opt/maude-3.5.1
          sudo unzip -oq /tmp/maude.zip -d /opt/maude-3.5.1
          sudo chmod +x /opt/maude-3.5.1/maude
          # Maude locates its prelude through MAUDE_LIB; a symlink alone loses
          # that location when called from a repository/proof directory.
          cat > /tmp/vela-maude <<'SH'
          #!/bin/sh
          export MAUDE_LIB=/opt/maude-3.5.1
          exec "$MAUDE_LIB/maude" "$@"
          SH
          sudo install -m755 /tmp/vela-maude /usr/local/bin/maude
          tamarin-prover --version 2>&1 | tee /tmp/vela-tamarin-version.txt
          if rg -q 'WARNING:|unsupported' /tmp/vela-tamarin-version.txt; then
            echo 'Tamarin/Maude installation self-check failed' >&2
            exit 1
          fi
          maude --version

      - name: Cache standalone pinned F* for journal correspondence
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/vela-formal-fstar-2025.10.06
          key: formal-fstar-2025.10.06-${{ runner.os }}-${{ runner.arch }}-940c187d

      - name: Activate prebuilt F* and bundled Z3 for journal correspondence
        run: |
          set -euo pipefail
          proof_root="$HOME/.local/opt/vela-formal-fstar-2025.10.06"
          security/assurance/install-formal-fstar.sh "$proof_root"
          printf 'VELA_FSTAR_BIN=%s/fstar/bin/fstar.exe\n' "$proof_root" >> "$GITHUB_ENV"
          printf '%s/fstar/bin\n' "$proof_root" >> "$GITHUB_PATH"

      - name: Check reviewed model correspondence
        run: python3 security/formal/check-correspondence.py

      - name: Check driver proof source-policy regressions
        run: python3 -m unittest discover -s security/formal/tests -p 'test_driver_proof_sources.py'

      - name: Prove malicious-server enrollment, shares, and device authentication
        run: VELA_PROOF_OUT="$RUNNER_TEMP/network-proofs" security/formal/run-network-boundary-proofs.sh

      # Keep installation separate from the later run-all.sh proof execution.
      - name: Restore pinned ProVerif toolchain
        id: proverif-toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.opam
          key: opam-proverif-2.05-ocaml5.1.1-v2

      - name: Install pinned ProVerif 2.05 (setup only)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          # Avoid opam's recommended distro OCaml; the pinned switch supplies it.
          # ProVerif's opam package declares the GTK2 development dependency.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends opam libgtk2.0-dev pkg-config
          opam init --no-setup --bare --yes
          if ! opam switch list --short | grep -Fxq 'vela-proverif'; then
            opam switch create vela-proverif ocaml-base-compiler.5.1.1 --yes
          fi
          opam install --switch vela-proverif --yes proverif.2.05
          opam list --switch vela-proverif --installed proverif
          echo "$(opam var bin --switch vela-proverif)" >> "$GITHUB_PATH"

      - name: Cache completed ProVerif toolchain
        if: steps.proverif-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.opam
          key: ${{ steps.proverif-toolchain-cache.outputs.cache-primary-key }}

      - name: Prove Path-ORAM access-pattern hiding (ProVerif)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assurance-logs"
          security/assurance/bounded.sh security/formal/run-oram-access-hiding-proofs.sh 2>&1 | tee "$RUNNER_TEMP/assurance-logs/oram-precheck.log"

      - name: Check computational proof runner failure handling
        run: python3 -m unittest discover -s security/formal/tests -p 'test_cryptoverif_runner.py'

      # Computational (not symbolic) proofs of the hybrid KEM combiner. Built
      # with the pinned OCaml switch the ProVerif step put on PATH.
      - name: Prove the hybrid KEM combiner in the computational model (CryptoVerif 2.12)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cryptoverif.tar.gz https://bblanche.gitlabpages.inria.fr/CryptoVerif/cryptoverif2.12.tar.gz
          echo "77730861be7bfbde5b078f7785db478869d33aba2761a428d50aaad537098757  /tmp/cryptoverif.tar.gz" | sha256sum -c
          mkdir -p /tmp/cryptoverif && tar -xzf /tmp/cryptoverif.tar.gz -C /tmp/cryptoverif
          (cd /tmp/cryptoverif/cryptoverif2.12 && ./build)
          mkdir -p "$RUNNER_TEMP/assurance-logs"
          CRYPTOVERIF=/tmp/cryptoverif/cryptoverif2.12/cryptoverif \
            VELA_PROOF_OUT="$RUNNER_TEMP/assurance-logs/cryptoverif" \
            security/formal/run-cryptoverif-proofs.sh

      - name: Check bounded policies and rekey handler/database conformance
        run: |
          cargo test --manifest-path serverVELA/Cargo.toml --test rekey_state_model
          cargo test --manifest-path serverVELA/Cargo.toml --test session_capability_model
          cargo test --manifest-path serverVELA/Cargo.toml --test enrollment_ceremony_model
          cargo test --manifest-path serverVELA/Cargo.toml --test recovery_lifecycle_model
          cargo test --manifest-path serverVELA/Cargo.toml --test share_channel_model
          cargo test --manifest-path serverVELA/Cargo.toml --test recovery_possession_model
          cargo test --manifest-path serverVELA/Cargo.toml --test pairing_model
          cargo test --manifest-path serverVELA/Cargo.toml --test challenge_single_use_model
          cargo test --manifest-path serverVELA/Cargo.toml --test login_driver_handler
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-session-policy --test login_driver
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-session-policy --lib revocation_driver
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-session-policy --lib deletion_driver
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-session-policy --lib deletion_interpreter
          cargo test --manifest-path serverVELA/Cargo.toml --test account_deletion_model
          cargo test --manifest-path serverVELA/Cargo.toml --test device_revocation_model
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-recovery-policy --test redemption_driver
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-share-policy --test driver
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-share-policy --lib
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-recovery-policy --test possession_driver
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-recovery-policy --test webauthn_driver
          cargo test --manifest-path serverVELA/Cargo.toml --test integration
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-enrollment-policy
          cargo test --manifest-path serverVELA/Cargo.toml -p vela-rekey-policy --lib
          cargo test --manifest-path libVELA/vela-client-recovery-policy/Cargo.toml --test bounded_refinement

      - name: Verify the desktop, Android, Apple, and web epoch wire contract
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-lib
        run: |
          cargo test --manifest-path libVELA/vela-client-share-policy/Cargo.toml
          cargo test --manifest-path libVELA/vela-crypto/Cargo.toml --lib
          cargo test --manifest-path libVELA/vela-crypto/Cargo.toml \
            rekey::tests::fleet_wire_matrix_is_cross_client_and_epoch_compatible
          cargo test --manifest-path libVELA/vela-android-bridge/Cargo.toml --lib
          cargo test --manifest-path libVELA/vela-apple-bridge/Cargo.toml --lib
          cargo test --manifest-path libVELA/vela-wasm-bridge/Cargo.toml --lib

      - name: Run every assurance model, including the credential-release ladder
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-lib
          VELA_CARGO_JOBS: 4
          VELA_MEMORY_MAX: 10G
        run: security/assurance/run-all.sh --out "$RUNNER_TEMP/assurance-logs"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assurance-symbolic-logs
          path: |
            ${{ runner.temp }}/assurance-logs
            ${{ runner.temp }}/network-proofs

  sharing-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_TEST_THREADS: 1
      # bounded.sh defaults to one job under 3 GiB (safe on a workstation).
      # The runner is a dedicated 4-core, 16 GiB machine.
      VELA_CARGO_JOBS: 4
      VELA_MEMORY_MAX: 10G
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install desktop core build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y clang pkg-config libudev-dev libwayland-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopVELA -> ../target
          shared-key: security-desktop-core-v3
      - name: Check desktop policy callers and recoverable share commits
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sharing-logs"
          security/assurance/bounded.sh cargo test --manifest-path desktopVELA/Cargo.toml -p vela-desktop-core --locked --lib 2>&1 | tee "$RUNNER_TEMP/sharing-logs/desktop-core-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assurance-sharing-logs
          path: ${{ runner.temp }}/sharing-logs

  # The owner's build box (self-hosted runners labelled `vela-box`) takes the
  # proof matrix only when it is up (its heartbeat variable is under five
  # minutes old) and only for the owner's own runs on this repository's
  # branches. Everything else, including any pull request from a fork, uses
  # GitHub-hosted runners. The box enforces the same rule itself in a
  # job-started hook, so editing this job cannot route a fork's code there.
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          HEARTBEAT: ${{ vars.VELA_BOX_HEARTBEAT }}
          DISABLED: ${{ vars.VELA_BOX_DISABLED }}
        run: |
          runner='"ubuntu-24.04"'
          now=$(date +%s)
          if [[ $ACTOR == "$OWNER" && $TRIGGERING_ACTOR == "$OWNER" && $DISABLED != true ]] \
             && [[ $EVENT != pull_request || $HEAD_REPO == "$REPO" ]] \
             && [[ $HEARTBEAT =~ ^[0-9]+$ ]] && (( now - HEARTBEAT < 300 )); then
            runner='["self-hosted","vela-box"]'
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "proof matrix runs on: $runner"

  # One job per policy crate, in parallel: each regenerates and checks its own
  # extractions, interpreter and driver proofs. `refinement-boundary` then
  # audits the freshly regenerated extractions of all of them together.
  refinement:
    name: refinement (${{ matrix.name }})
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Slowest first, so they start before the runners fill up.
          # vela-session-policy is split into its independent gate groups.
          - { name: vela-session-policy-login, dir: serverVELA/vela-session-policy, script: verify-fstar.sh, args: login, fresh: false, ships: false }
          - { name: vela-session-policy-deletion, dir: serverVELA/vela-session-policy, script: verify-fstar.sh, args: deletion, fresh: false, ships: false }
          - { name: vela-session-policy-revocation, dir: serverVELA/vela-session-policy, script: verify-fstar.sh, args: revocation, fresh: false, ships: false }
          - { name: vela-session-policy-core, dir: serverVELA/vela-session-policy, script: verify-fstar.sh, args: core, fresh: true, ships: true }
          - { name: vela-recovery-policy, dir: serverVELA/vela-recovery-policy, script: verify-fstar.sh, fresh: true, ships: true }
          - { name: vela-rekey-policy, dir: serverVELA/vela-rekey-policy, script: verify-fstar.sh, fresh: true, ships: true }
          - { name: vela-enrollment-policy, dir: serverVELA/vela-enrollment-policy, script: verify-fstar.sh, fresh: true, ships: true }
          - { name: vela-share-policy, dir: serverVELA/vela-share-policy, script: verify-fstar.sh, fresh: true, ships: true }
          - { name: share-facts, dir: libVELA/vela-crypto, script: verify-share-facts-fstar.sh, fresh: false, ships: true }
          - { name: vela-sync-policy, dir: libVELA/vela-sync-policy, script: verify-fstar.sh, fresh: true, ships: true }
          - { name: vela-client-recovery-policy, dir: libVELA/vela-client-recovery-policy, script: verify-fstar.sh, fresh: true, ships: true }
          - { name: vela-client-share-policy, dir: libVELA/vela-client-share-policy, script: verify-fstar.sh, fresh: true, ships: true }
    env:
      CARGO_BUILD_JOBS: 1
      OPAMJOBS: 1
      MAKEFLAGS: -j1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install build prerequisites
        if: runner.environment == 'github-hosted'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          # opam builds our pinned OCaml. Its recommended distro OCaml is redundant.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends opam libgmp-dev pkg-config unzip jq clang nodejs
      - name: Restore pinned proof toolchain
        id: refinement-toolchain-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/opt/vela-hax-0.3.7
            ~/.rustup/toolchains/nightly-2025-11-08-x86_64-unknown-linux-gnu
          key: refinement-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('security/assurance/install-hax.sh') }}
      - name: Install pinned hax, F* and Z3
        if: runner.environment == 'github-hosted' && steps.refinement-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refinement-logs"
          VELA_MEMORY_MAX=6G VELA_STEP_TIMEOUT=5400 security/assurance/bounded.sh security/assurance/install-hax.sh 2>&1 | tee "$RUNNER_TEMP/refinement-logs/toolchain-install-${{ matrix.name }}.log"
      - name: Activate and check pinned proof tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refinement-logs"
          {
            # The build box keeps the same pinned tools at VELA_PROOF_TOOLS.
            proof_tools="${VELA_PROOF_TOOLS:-$HOME/.local/opt/vela-hax-0.3.7}"
            export CARGO_HOME="$proof_tools/cargo-home" OPAMROOT="$proof_tools/opam"
            export PATH="$proof_tools/bin:$OPAMROOT/vela-hax/bin:$proof_tools/fstar/bin:$PATH"
            printf 'CARGO_HOME=%s\nOPAMROOT=%s\n' "$CARGO_HOME" "$OPAMROOT" >> "$GITHUB_ENV"
            printf '%s\n' "$proof_tools/bin" "$OPAMROOT/vela-hax/bin" "$proof_tools/fstar/bin" >> "$GITHUB_PATH"
            cargo hax --version | grep -Fx 'version=0.3.7'
            test -x "$OPAMROOT/vela-hax/bin/hax-engine"
            test "$(opam list --switch vela-hax --installed --columns=version --short hax-engine)" = 0.3.7
            test "$(cat "$proof_tools/fstar/version.txt")" = 2025.10.06
            fstar.exe --version
            z3-4.13.3 --version
            rustc +nightly-2025-11-08 --version
          } 2>&1 | tee "$RUNNER_TEMP/refinement-logs/toolchain-activation-${{ matrix.name }}.log"
      - name: Cache completed proof toolchain
        if: runner.environment == 'github-hosted' && steps.refinement-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/opt/vela-hax-0.3.7
            ~/.rustup/toolchains/nightly-2025-11-08-x86_64-unknown-linux-gnu
          key: ${{ steps.refinement-toolchain-cache.outputs.cache-primary-key }}
      # Installed tools are immutable above; application dependencies need their
      # own evolving cache. Activate CARGO_HOME before restoring this cache.
      # Keep proof outputs fresh: this action caches dependency build artifacts,
      # not successful VELA proof verdicts or workspace crate artifacts.
      # Installed tools are immutable above; application dependencies need their
      # own evolving cache. Activate CARGO_HOME before restoring this cache.
      # Keep proof outputs fresh: this action caches dependency build artifacts,
      # not successful VELA proof verdicts or workspace crate artifacts.
      - name: Cache refinement Rust dependencies
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }} -> ../../target
          shared-key: refinement-rust-v2-${{ matrix.name }}
          key: ${{ hashFiles('security/assurance/install-hax.sh') }}
          cache-bin: false
      - name: Extract and check ${{ matrix.name }}
        env:
          CRATE_DIR: ${{ matrix.dir }}
          SCRIPT: ${{ matrix.script }}
          SCRIPT_ARGS: ${{ matrix.args }}
          FRESH: ${{ matrix.fresh }}
          LOG_NAME: ${{ matrix.name }}
          # The box may be shared with local proof work; the job keeps its 90-minute cap.
          VELA_STEP_TIMEOUT: "3600"
        run: |
          mkdir -p "$RUNNER_TEMP/refinement-logs"
          # Require fresh output even when the repository contains extractions.
          if [[ $FRESH == true && -d "$CRATE_DIR/proofs/fstar/extraction" ]]; then
            find "$CRATE_DIR/proofs/fstar/extraction" -maxdepth 1 -type f \( -name '*.fst' -o -name '*.fsti' \) -delete
          fi
          log="$RUNNER_TEMP/refinement-logs/$LOG_NAME.log"
          # shellcheck disable=SC2086 # SCRIPT_ARGS is empty or one word
          if ! security/assurance/bounded.sh "$CRATE_DIR/$SCRIPT" $SCRIPT_ARGS > "$log" 2>&1; then
            tail -n 100 "$log"
            exit 1
          fi
      # Keep repository-relative paths so the boundary job can lay them back.
      - name: Collect checked extractions
        if: always()
        env:
          CRATE_DIR: ${{ matrix.dir }}
          SHIPS: ${{ matrix.ships }}
        run: |
          out="$RUNNER_TEMP/refinement-extractions"
          mkdir -p "$out"
          # Only the job that regenerated a crate's historical extraction ships
          # it, so a committed copy never overwrites the checked one.
          skip=()
          [[ $SHIPS == true ]] || skip=(-not -path '*/extraction/*')
          find "$CRATE_DIR/proofs/fstar" -type f -name '*.fst' "${skip[@]}" \
            \( -path '*/extraction/*' -o -path '*/extraction-*' -o -path '*-lemmas/*' -o -path '*-composition/*' -o -path '*/models/*' \) \
            -exec cp --parents {} "$out" \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/refinement-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-extractions-${{ matrix.name }}
          path: ${{ runner.temp }}/refinement-extractions

  # Audits the selected postconditions and reviewed assumptions across every
  # crate, over the extractions the matrix jobs just regenerated and checked,
  # and republishes the combined evidence under the historical artifact names.
  refinement-boundary:
    needs: refinement
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every crate job to pass
        env:
          RESULT: ${{ needs.refinement.result }}
        run: test "$RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: refinement-extractions-*
          merge-multiple: true
          path: .
      - name: Audit extraction assumptions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refinement-logs"
          python3 security/assurance/check-proof-boundary.py | tee "$RUNNER_TEMP/refinement-logs/proof-boundary.log"
      - uses: actions/upload-artifact@v4
        with:
          name: refinement-logs-proof-boundary
          path: ${{ runner.temp }}/refinement-logs
      - uses: actions/upload-artifact/merge@v4
        with:
          name: assurance-refinement-logs
          pattern: refinement-logs-*
      - uses: actions/upload-artifact/merge@v4
        with:
          name: assurance-refinement-extractions
          pattern: refinement-extractions-*

  static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Install semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep --version

      - name: Run static scan (hard gate)
        run: ./security/run-scan.sh

  regression:
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1

      # Its own cache: `cargo build` of the server resolves features differently
      # from formal-rekey's `cargo test`, so sharing that cache only partly helps.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: serverVELA -> ../target
          shared-key: security-regression-v3

      - name: Build server
        run: cargo build --manifest-path serverVELA/Cargo.toml

      - name: Run exploit regression suite (hard gate)
        run: ./security/exploits/run-exploits.sh
