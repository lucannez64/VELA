name: security

# Project-specific security tooling (see SECURITY_AUDIT.md):
#   - static-scan : semgrep (extension JS), scan.py (Rust rules), cargo-audit,
#                   cargo-deny.
#   - regression  : live exploits against a fresh isolated loopback server
#                   (temp DATA_DIR, teardown via trap — never touches production).
#
# Gating status:
#   - both regression tests (web-session grant binding, IDOR/XFF defence) ARE
#     hard gates.
#   - static-scan IS a hard gate now: the findings it used to report (M4, L2,
#     E-1, E-2) are fixed, so a new one means a regression rather than a known
#     issue. Do not reintroduce continue-on-error to get a PR through.

on:
  pull_request:
    paths:
      - "security/**"
      - "serverVELA/**"
      - "libVELA/vela-crypto/**"
      - "libVELA/vela-client-recovery-policy/**"
      - "libVELA/vela-core/**"
      - "libVELA/vela-android-bridge/**"
      - "libVELA/vela-apple-bridge/**"
      - "libVELA/vela-wasm-bridge/**"
      - "desktopVELA/**"
      - "androidVELA/**"
      - "iosVELA/**"
      - "extension/src/**"
      - "Cargo.lock"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
  push:
    branches: ["main"]
    paths:
      - "security/**"
      - "serverVELA/**"
      - "libVELA/vela-crypto/**"
      - "libVELA/vela-client-recovery-policy/**"
      - "libVELA/vela-core/**"
      - "libVELA/vela-android-bridge/**"
      - "libVELA/vela-apple-bridge/**"
      - "libVELA/vela-wasm-bridge/**"
      - "desktopVELA/**"
      - "androidVELA/**"
      - "iosVELA/**"
      - "extension/src/**"
      - "Cargo.lock"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-rekey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tamarin 1.12.0 and Maude
        run: |
          sudo apt-get update
          sudo apt-get install --yes maude ripgrep
          curl --fail --silent --show-error --location \
            --output /tmp/tamarin-prover.tar.gz \
            https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          echo "201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  /tmp/tamarin-prover.tar.gz" \
            | sha256sum --check
          sudo tar --extract --gzip --file /tmp/tamarin-prover.tar.gz --directory /usr/local/bin
          tamarin-prover --version
          maude --version

      - name: Prove rekey state, capsule, and mutation invariants
        run: ./security/formal/run-rekey-proofs.sh

      - name: Prove web-session capability lifecycle
        run: ./security/formal/run-session-proofs.sh

      - name: Prove permanent-device enrollment ceremony
        run: ./security/formal/run-enrollment-proofs.sh

      - name: Prove account-recovery lifecycle
        run: ./security/formal/run-recovery-proofs.sh

      - name: Prove client recovery reconstruction boundary
        run: ./security/formal/run-client-recovery-proofs.sh

      - name: Prove recovery setup publication consistency
        run: ./security/formal/run-recovery-publication-proofs.sh

      - name: Prove crash-consistent recovery publication
        run: ./security/formal/run-recovery-publication-recovery-proofs.sh

      - name: Prove the full 2-of-3 pair-selection threshold
        run: ./security/formal/run-pair-selection-proofs.sh

      - name: Prove the cross-user share-channel binding integrity
        run: ./security/formal/run-share-channel-proofs.sh

      - name: Exhaust the bounded model against real handlers and Turso
        run: |
          cargo test --manifest-path serverVELA/Cargo.toml --test rekey_state_model
          cargo test --manifest-path serverVELA/Cargo.toml --test session_capability_model
          cargo test --manifest-path serverVELA/Cargo.toml --test enrollment_ceremony_model
          cargo test --manifest-path serverVELA/Cargo.toml --test recovery_lifecycle_model
          cargo test --manifest-path serverVELA/Cargo.toml --test integration \
            recovery_publication_finalizes_exactly_the_current_staged_split
          cargo test --manifest-path libVELA/vela-client-recovery-policy/Cargo.toml --test bounded_refinement

      - name: Verify the desktop, Android, Apple, and web epoch wire contract
        run: |
          cargo test --manifest-path libVELA/vela-crypto/Cargo.toml recovery::tests
          cargo test --manifest-path libVELA/vela-crypto/Cargo.toml \
            rekey::tests::fleet_wire_matrix_is_cross_client_and_epoch_compatible
          cargo test --manifest-path libVELA/vela-android-bridge/Cargo.toml --lib
          cargo test --manifest-path libVELA/vela-apple-bridge/Cargo.toml --lib
          cargo test --manifest-path libVELA/vela-wasm-bridge/Cargo.toml --lib

  static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Install semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep --version

      - name: Run static scan (hard gate)
        run: ./security/run-scan.sh

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build server
        run: cargo build --manifest-path serverVELA/Cargo.toml

      - name: Run exploit regression suite (hard gate)
        run: ./security/exploits/run-exploits.sh
