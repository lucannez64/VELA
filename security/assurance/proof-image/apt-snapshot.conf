# Fixed Ubuntu archive snapshot for every proof/security job that still
# installs packages on a GitHub-hosted runner (T10).
#
# snapshot.ubuntu.com keeps an immutable view of the Ubuntu archive, so the
# same date resolves the same package versions forever, unlike archive.ubuntu.com
# where noble-updates moves forward. The proof image uses the same stamp, and
# security/assurance/check-env-pins.py fails if a workflow or the Dockerfile
# drifts from it.
#
# To move the pin: pick a newer stamp from https://snapshot.ubuntu.com/, update
# this file, every workflow that installs apt packages, and rebuild the image.
VELA_UBUNTU_SNAPSHOT=20261104T000000Z
VELA_UBUNTU_SUITES="noble noble-updates noble-security"
VELA_UBUNTU_COMPONENTS="main restricted universe multiverse"
