<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELA formalization plan</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --surface-2: #efeee9; --border: #d9d8d2;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
  --edge: #b9b8b0; --edge-hi: #2a78d6; --edge-lo: #eb6834;
  --done-fill: #e3f1e3; --done-ink: #1d6b1d; --ready-fill: #e4eefb; --ready-ink: #1f5fae;
  --prog-fill: #fdf0d2; --prog-ink: #8a5a00; --block-fill: #fbe4e3; --block-ink: #b03231;
  --wait-fill: #f1f0ec; --hard: #c23b3a; --crit: #6250d6;
  --a-B: #2a78d6; --a-T: #eb6834; --a-O: #1baf7a; --a-H: #eda100;
  --a-P: #e87ba4; --a-C: #008300; --a-N: #6250d6; --a-Z: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422; --border: #3a3a37;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --edge: #4a4a46; --edge-hi: #3987e5; --edge-lo: #d95926;
    --done-fill: #183218; --done-ink: #8fd18f; --ready-fill: #16263b; --ready-ink: #8db8ef;
    --prog-fill: #3a2c0c; --prog-ink: #f2c25c; --block-fill: #3d1a1a; --block-ink: #f09090;
    --wait-fill: #222220; --hard: #e66767; --crit: #9085e9;
    --a-B: #3987e5; --a-T: #d95926; --a-O: #199e70; --a-H: #c98500;
    --a-P: #d55181; --a-C: #008300; --a-N: #9085e9; --a-Z: #e66767;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) 400px;
  height: 100vh; background: var(--surface-0); color: var(--text-primary); }
header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
  padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
header h1 { font-size: 17px; margin: 0 4px 0 0; }
.stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.bar { width: 120px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--done-ink); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
.live.on i { background: var(--done-ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--done-ink) 25%, transparent); }
.live.err i { background: var(--block-ink); }
input[type=search] { width: 200px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface-0); color: inherit; font: inherit; }
button { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1);
  color: inherit; font: inherit; cursor: pointer; }
button:hover { background: var(--surface-2); }
button[aria-pressed=true] { border-color: var(--edge-hi); color: var(--edge-hi); }
.chips { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px;
  background: var(--surface-1); border-bottom: 1px solid var(--border); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-0); cursor: pointer; font-size: 12px; user-select: none; }
.chip .sw { width: 10px; height: 10px; border-radius: 3px; }
.chip.off { opacity: .4; }
.chips .sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
.key { font-size: 12px; color: var(--text-secondary); display: inline-flex; gap: 5px; align-items: center; }
.key .sw { width: 14px; height: 10px; border-radius: 3px; border: 1px solid var(--border); }
#stage { position: relative; overflow: hidden; cursor: grab; background: var(--surface-0); }
#stage.drag { cursor: grabbing; }
svg { display: block; width: 100%; height: 100%; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.2; }
.edge.up { stroke: var(--edge-hi); stroke-width: 2.2; }
.edge.down { stroke: var(--edge-lo); stroke-width: 2.2; }
.edge.crit { stroke: var(--crit); stroke-width: 2.4; }
.edge.dim { opacity: .12; }
.node { cursor: pointer; }
.node rect.box { stroke: var(--border); stroke-width: 1; }
.node.waiting rect.box { fill: var(--wait-fill); }
.node.ready rect.box { fill: var(--ready-fill); stroke: var(--ready-ink); }
.node.done rect.box { fill: var(--done-fill); stroke: var(--done-ink); }
.node.unpushed rect.box { stroke-dasharray: 4 3; }
.node.progress rect.box { fill: var(--prog-fill); stroke: var(--prog-ink); stroke-width: 2; }
.node.blocked rect.box { fill: var(--block-fill); stroke: var(--block-ink); stroke-width: 2; }
.node.progress .pulse { stroke: var(--prog-ink); fill: none; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { from { opacity: .7; stroke-width: 1; } to { opacity: 0; stroke-width: 9; } }
@media (prefers-reduced-motion: reduce) { .node.progress .pulse { animation: none; opacity: 0; } }
.node.sel rect.box { stroke: var(--text-primary); stroke-width: 2.5; }
.node.match rect.box { stroke: var(--edge-hi); stroke-width: 2.5; }
.node.dim { opacity: .2; }
.node text { font-size: 11px; fill: var(--text-secondary); }
.node text.id { font: 600 11.5px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--text-primary); }
.node text.tag { font-size: 9.5px; fill: var(--text-muted); }
.node text.hard { font-size: 9.5px; fill: var(--hard); font-weight: 600; }
.node text.st { font-weight: 600; font-size: 9.5px; }
.st-done { fill: var(--done-ink); } .st-ready { fill: var(--ready-ink); }
.st-progress { fill: var(--prog-ink); } .st-blocked { fill: var(--block-ink); }
.lvl { font-size: 11px; fill: var(--text-muted); }
aside { grid-row: 3; grid-column: 2; display: flex; flex-direction: column; min-height: 0;
  background: var(--surface-1); border-left: 1px solid var(--border); }
#panel { flex: 1 1 60%; overflow: auto; padding: 14px 16px; min-height: 0; }
#logbox { flex: 1 1 40%; overflow: auto; padding: 10px 16px; border-top: 1px solid var(--border); min-height: 0; }
aside h2 { font-size: 15px; margin: 0 0 4px; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 14px 0 6px; }
#logbox h3 { margin-top: 2px; }
aside .meta { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 14px; margin: 10px 0; }
aside .meta b { font-size: 14px; } aside .meta span { color: var(--text-muted); font-size: 11px; }
aside ul { margin: 0; padding: 0; list-style: none; }
aside li { padding: 3px 0; border-bottom: 1px solid var(--surface-2); display: flex; gap: 8px; }
aside li a, .logrow a { font-family: ui-monospace, Menlo, monospace; color: var(--edge-hi); cursor: pointer; min-width: 42px; }
aside li .s { margin-left: auto; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.logrow { display: grid; grid-template-columns: 62px 56px 1fr; gap: 8px; padding: 5px 0;
  border-bottom: 1px solid var(--surface-2); font-size: 12px; }
.logrow .t { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.logrow .k { font-size: 11px; color: var(--text-muted); }
.logrow .m { grid-column: 3; word-break: break-word; }
.logrow.fresh { animation: fresh 2.5s ease-out; }
@keyframes fresh { from { background: var(--prog-fill); } to { background: transparent; } }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.muted { color: var(--text-muted); }
.done-ink { color: var(--done-ink); } .ready-ink { color: var(--ready-ink); } .hard-ink { color: var(--hard); }
.progress-ink { color: var(--prog-ink); } .blocked-ink { color: var(--block-ink); } .waiting-ink { color: var(--text-muted); }
#tip { position: fixed; pointer-events: none; max-width: 340px; padding: 7px 9px; border-radius: 6px;
  background: var(--surface-1); border: 1px solid var(--border); box-shadow: 0 4px 14px rgb(0 0 0 / .15);
  font-size: 12px; display: none; z-index: 5; color: var(--text-primary); }
#table { position: absolute; inset: 0; overflow: auto; background: var(--surface-1); display: none; padding: 12px 16px; }
#table table { border-collapse: collapse; width: 100%; font-size: 12px; }
#table th, #table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--surface-2); vertical-align: top; }
#table th { position: sticky; top: 0; background: var(--surface-1); color: var(--text-muted); font-weight: 600; }
#table tr { cursor: pointer; } #table tr:hover td { background: var(--surface-2); }
@media (max-width: 900px) {
  .viz-root { grid-template-columns: 1fr; grid-template-rows: auto auto 520px auto; height: auto; }
  header, .chips { grid-column: 1; } aside { grid-row: 4; grid-column: 1; border-left: 0; border-top: 1px solid var(--border); height: 560px; }
  input[type=search] { width: 160px; } header { gap: 10px; }
}
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <h1>VELA formalization plan</h1>
    <div class="stat"><b id="sDone"></b><span>done</span></div>
    <div class="stat"><b id="sProg"></b><span>in progress</span></div>
    <div class="stat"><b id="sReady"></b><span>ready</span></div>
    <div class="stat"><b id="sWait"></b><span>waiting</span></div>
    <div class="stat liveonly"><b id="sUnpushed"></b><span>not pushed</span></div>
    <div><div class="bar"><i id="sBar"></i></div><span class="muted" id="sPct"></span></div>
    <input type="search" id="q" placeholder="Find a step (id or words)" aria-label="Find a step">
    <button id="bFit">Fit all</button>
    <button id="bProg" aria-pressed="false">In progress</button>
    <button id="bReady" aria-pressed="false">Ready</button>
    <button id="bCrit" aria-pressed="false">Critical path</button>
    <button id="bTable" aria-pressed="false">Table</button>
    <div class="stat liveonly"><b id="sLoad">–</b><span>load here</span></div>
    <div class="stat liveonly"><b id="sBox">–</b><span>load build box</span></div>
    <div class="stat liveonly"><b id="sGit">–</b><span id="sGitL">head / origin</span></div>
    <div class="stat liveonly"><b id="sAhead">–</b><span>commits ahead</span></div>
    <span class="live" id="live"><i></i><span id="liveT">static file</span></span>
  </header>
  <div class="chips" id="chips"></div>
  <div id="stage">
    <svg id="svg"><g id="vp"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div id="table"></div>
  </div>
  <aside><div id="panel"></div><div id="logbox"></div></aside>
</div>
<div id="tip"></div>
<script>
const PLAN = __PLAN_DATA__;
const KEY = "vela-formalization-plan-done";
const W = 196, H = 52, COL = 250, GAP = 12;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nodes = PLAN.nodes, byId = Object.fromEntries(nodes.map(n => [n.id, n]));
nodes.forEach(n => n.users = []);
nodes.forEach(n => n.deps.forEach(d => byId[d].users.push(n.id)));
const crit = new Set(PLAN.critical_path);
const critEdges = new Set(PLAN.critical_path.slice(1).map((id, i) => PLAN.critical_path[i] + ">" + id));

// Progress source: the plan-live.py server when present, else this browser's storage.
let LIVE = false, live = { steps: {}, log: [], facts: {} }, lastLive = 0, lastSig = "", seenLog = 0;
const store = { get() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} } };
let localDone = new Set(store.get().filter(id => byId[id]));
const entry = id => LIVE ? live.steps[id] : (localDone.has(id) ? { state: "done" } : undefined);
const isDone = id => entry(id)?.state === "done";
let sel = null, areasOff = new Set(), filter = null, critOn = false, query = "";

// ---------- layout: columns by level, rows ordered by barycenter sweeps ----------
const levels = [];
nodes.forEach(n => (levels[n.level] ||= []).push(n));
const areaOrder = Object.keys(PLAN.areas);
levels.forEach(l => l.sort((a, b) => areaOrder.indexOf(a.area) - areaOrder.indexOf(b.area) || a.step - b.step));
levels.forEach(l => l.forEach((n, i) => n.r = i));
const bary = (n, list) => list.length ? list.reduce((s, id) => s + byId[id].r, 0) / list.length : n.r;
for (let it = 0; it < 12; it++) {
  const down = it % 2 === 0;
  for (const l of (down ? levels.slice(1) : levels.slice(0, -1).reverse())) {
    l.forEach(n => n.b = bary(n, down ? n.deps : n.users));
    l.sort((a, b) => a.b - b.b);
    l.forEach((n, i) => n.r = i);
  }
}
const maxRows = Math.max(...levels.map(l => l.length));
levels.forEach(l => {
  const off = (maxRows - l.length) * (H + GAP) / 2;
  l.forEach((n, i) => { n.x = 40 + n.level * COL; n.y = 40 + off + i * (H + GAP); });
});
const WORLD_W = 80 + levels.length * COL, WORLD_H = 80 + maxRows * (H + GAP);

// ---------- drawing ----------
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const gE = $("edges"), gN = $("nodes");
levels.forEach((l, i) => { el("text", { x: 40 + i * COL, y: 24, class: "lvl" }, gN).textContent = "Level " + i; });
const edges = [];
nodes.forEach(n => n.deps.forEach(d => {
  const a = byId[d], x1 = a.x + W, y1 = a.y + H / 2, x2 = n.x, y2 = n.y + H / 2, c = Math.max(40, (x2 - x1) / 2);
  edges.push({ from: d, to: n.id, p: el("path", { class: "edge", d: `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}` }, gE) });
}));
const clip = (s, k) => s.length > k ? s.slice(0, k - 1) + "…" : s;
nodes.forEach(n => {
  const g = el("g", { class: "node", transform: `translate(${n.x},${n.y})`, tabindex: 0, role: "button", "aria-label": `${n.id} ${n.title}` }, gN);
  el("rect", { class: "pulse", width: W, height: H, rx: 6 }, g);
  el("rect", { class: "box", width: W, height: H, rx: 6 }, g);
  el("rect", { width: 4, height: H - 8, x: 3, y: 4, rx: 2, fill: `var(--a-${n.area})` }, g);
  el("text", { class: "id", x: 13, y: 16 }, g).textContent = n.id;
  const x0 = 13 + n.id.length * 7.3 + 6;
  el("text", { class: "tag", x: x0, y: 16 }, g).textContent = n.size;
  if (n.hard) el("text", { class: "hard", x: x0 + n.size.length * 7 + 4, y: 16 }, g).textContent = "hard";
  n.stEl = el("text", { x: W - 8, y: 16, "text-anchor": "end" }, g);
  const t1 = el("text", { x: 13, y: 31 }, g), t2 = el("text", { x: 13, y: 44 }, g);
  let a = "", b = "";
  for (const w of n.title.split(" ")) { if (!b && (a + " " + w).trim().length <= 30) a = (a + " " + w).trim(); else b = (b + " " + w).trim(); }
  t1.textContent = a; t2.textContent = clip(b, 31);
  n.g = g;
  g.addEventListener("click", e => { e.stopPropagation(); select(n.id); });
  g.addEventListener("keydown", e => { if (e.key === "Enter") select(n.id); });
  g.addEventListener("mousemove", e => showTip(n, e));
  g.addEventListener("mouseleave", () => tip.style.display = "none");
});

// ---------- status ----------
function status(n) {
  const s = entry(n.id)?.state;
  if (s === "done") return "done";
  if (s === "in_progress") return "progress";
  if (s === "blocked") return "blocked";
  return n.deps.every(isDone) ? "ready" : "waiting";
}
const label = { done: "done", progress: "in progress", blocked: "blocked", ready: "ready", waiting: "waiting" };
const unpushed = id => LIVE && isDone(id) && live.facts?.pushed?.[id] === false;
const ancestors = id => { const s = new Set(), st = [id]; while (st.length) for (const d of byId[st.pop()].deps) if (!s.has(d)) { s.add(d); st.push(d); } return s; };
const descendants = id => { const s = new Set(), st = [id]; while (st.length) for (const u of byId[st.pop()].users) if (!s.has(u)) { s.add(u); st.push(u); } return s; };
const dur = ms => { if (!(ms >= 0)) return "–"; const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : h ? `${h}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`; };
const ago = iso => iso ? dur(Date.now() - Date.parse(iso)) + " ago" : "–";
const hhmm = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); };
const runtime = e => e?.started ? dur((e.finished ? Date.parse(e.finished) : Date.now()) - Date.parse(e.started)) : "–";

function render() {
  if (!LIVE) store.set([...localDone]);
  const c = { done: 0, progress: 0, blocked: 0, ready: 0, waiting: 0 };
  let unp = 0;
  const up = sel ? ancestors(sel) : null, down = sel ? descendants(sel) : null;
  const q = query.toLowerCase();
  nodes.forEach(n => {
    const s = status(n); c[s]++; if (unpushed(n.id)) unp++;
    n.stEl.textContent = { done: unpushed(n.id) ? "✓ not pushed" : "✓ done", progress: "◐ in progress", blocked: "✕ blocked", ready: "○ ready", waiting: "" }[s];
    n.stEl.setAttribute("class", "st st-" + s);
    const match = q && (n.id.toLowerCase().includes(q) || n.title.toLowerCase().includes(q) || n.done.toLowerCase().includes(q));
    const dim = areasOff.has(n.area) || (filter && s !== filter) || (critOn && !crit.has(n.id))
      || (sel && n.id !== sel && !up.has(n.id) && !down.has(n.id)) || (q && !match);
    n.dim = dim;
    n.g.setAttribute("class", `node ${s}${unpushed(n.id) ? " unpushed" : ""}${n.id === sel ? " sel" : ""}${match ? " match" : ""}${dim ? " dim" : ""}`);
  });
  edges.forEach(e => {
    let cls = "edge";
    if (sel) {
      if ((e.to === sel || up.has(e.to)) && up.has(e.from)) cls += " up";
      else if ((e.from === sel || down.has(e.from)) && down.has(e.to)) cls += " down";
      else cls += " dim";
    } else if (critOn) cls += critEdges.has(e.from + ">" + e.to) ? " crit" : " dim";
    else if (byId[e.from].dim || byId[e.to].dim) cls += " dim";
    e.p.setAttribute("class", cls);
  });
  $("sDone").textContent = `${c.done} / ${nodes.length}`; $("sProg").textContent = c.progress + (c.blocked ? ` +${c.blocked} blocked` : "");
  $("sReady").textContent = c.ready; $("sWait").textContent = c.waiting; $("sUnpushed").textContent = unp;
  const pct = Math.round(100 * c.done / nodes.length); $("sBar").style.width = pct + "%"; $("sPct").textContent = pct + "% of steps";
  const keep = $("panel").scrollTop;
  $("panel").innerHTML = sel ? detail(byId[sel], up, down) : overview();
  $("panel").scrollTop = keep;
  renderLog();
  if (tableOn) drawTable();
}
const link = id => `<li><a data-go="${id}">${id}</a><span>${esc(byId[id].title)}</span><span class="s ${status(byId[id])}-ink">${label[status(byId[id])]}</span></li>`;
function detail(n, up, down) {
  const s = status(n), e = entry(n.id), blocking = n.deps.filter(d => !isDone(d));
  const liveMeta = LIVE && e ? `<div class="meta"><b>${runtime(e)}</b><b>${e.retries ?? 0}</b><b>${ago(e.updated)}</b><b>${esc(e.who || "–")}</b>
    <span>runtime</span><span>retries</span><span>last update</span><span>by</span></div>
    ${e.note ? `<p>${esc(e.note)}</p>` : ""}${e.commit ? `<p class="muted">commit ${esc(e.commit.slice(0, 10))} · ${unpushed(n.id) ? "not pushed" : "pushed"}</p>` : ""}` : "";
  const acts = LIVE
    ? `<div class="btns">${s !== "progress" && s !== "done" ? `<button data-act="start">Mark in progress</button>` : ""}
       ${s !== "done" ? `<button data-act="done">Mark done</button>` : ""}${e ? `<button data-act="undo">Reset step</button>` : ""}</div>`
    : `<button data-act="local">${localDone.has(n.id) ? "Mark not done" : "Mark done"}</button>`;
  return `<h2>${n.id} · ${esc(n.title)}</h2>
  <div class="muted">${esc(PLAN.areas[n.area])}</div>
  <div class="meta"><b class="${s}-ink">${label[s]}</b><b>${n.size}</b><b>${n.step}</b><b>${n.level}</b>
   <span>state</span><span>size</span><span>order</span><span>level</span></div>
  ${liveMeta}
  ${n.hard ? `<p class="hard-ink">Hard: this proof may need a redesign.</p>` : ""}
  ${crit.has(n.id) ? `<p class="muted">On the critical path.</p>` : ""}
  <h3>Done when</h3><p>${esc(n.done)}</p>${acts}
  <h3>Needs first (${n.deps.length})</h3><ul>${n.deps.map(link).join("") || '<li class="muted">Nothing, can start any time</li>'}</ul>
  ${blocking.length && s !== "done" ? `<p class="muted">Blocked by ${blocking.length}; ${up.size} steps upstream in total.</p>` : ""}
  <h3>Unblocks (${n.users.length})</h3><ul>${n.users.map(link).join("") || '<li class="muted">Nothing</li>'}</ul>
  <p class="muted">${down.size} steps depend on this one, directly or not.</p>`;
}
function overview() {
  const byState = st => nodes.filter(n => status(n) === st).sort((a, b) => a.step - b.step);
  const prog = byState("progress").concat(byState("blocked"));
  return `${prog.length ? `<h2>In progress</h2><ul>${prog.map(n => `<li><a data-go="${n.id}">${n.id}</a><span>${esc(n.title)}</span><span class="s ${status(n)}-ink">${status(n) === "blocked" ? "blocked" : runtime(entry(n.id))}</span></li>`).join("")}</ul><h3>Ready next</h3>` : "<h2>Ready next</h2>"}
  <ul>${byState("ready").map(n => link(n.id)).join("") || '<li class="muted">Nothing ready</li>'}</ul>
  <h3>Critical path</h3><ul>${PLAN.critical_path.map(link).join("")}</ul>
  <p class="muted">${LIVE ? "Live: progress comes from formalization-status.json via plan-live.py." : "Static file: done marks are saved in this browser only. Run <code>plan-live.py serve</code> for live progress."}</p>`;
}
function renderLog() {
  const box = $("logbox");
  if (!LIVE) { box.innerHTML = `<h3>Running log</h3><p class="muted">Available when served by plan-live.py.</p>`; return; }
  const rows = live.log.map((r, i) => ({ ...r, i })).filter(r => !sel || r.step === sel).slice(-200).reverse();
  box.innerHTML = `<h3>${sel ? `Log · ${sel}` : "Running log"}</h3>` + (rows.map(r =>
    `<div class="logrow${r.i >= seenLog ? " fresh" : ""}"><span class="t">${hhmm(r.t)}</span><span><a data-go="${esc(r.step)}">${esc(r.step)}</a><br><span class="k">${esc(r.kind)}${r.who ? " · " + esc(r.who) : ""}</span></span><span class="m">${esc(r.msg)}</span></div>`).join("")
    || '<p class="muted">No entries yet.</p>');
}
async function act(a) {
  if (a === "local") { localDone.has(sel) ? localDone.delete(sel) : localDone.add(sel); return render(); }
  if (a === "undo" && !confirm(`Reset ${sel}? Its progress record is removed (the log keeps the history).`)) return;
  await fetch("api/step", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: sel, action: a }) });
  poll();
}
$("panel").addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) return select(go.dataset.go, true);
  const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act);
});
$("logbox").addEventListener("click", e => { const go = e.target.closest("[data-go]"); if (go && byId[go.dataset.go]) select(go.dataset.go, true); });
function select(id, center) { sel = id; render(); if (center && id) focusNode(byId[id]); }

// ---------- live polling ----------
function headerFacts() {
  const f = live.facts || {};
  const ld = a => a ? `${a.slice(0, 3).map(x => x.toFixed(2)).join(" ")}` : "offline";
  $("sLoad").textContent = ld(f.load); $("sBox").textContent = ld(f.box);
  $("sLoad").title = f.load ? `${f.load[3]} cores` : ""; $("sBox").title = f.box ? `${f.box_host}, ${f.box[3]} cores` : "build box unreachable";
  $("sGit").textContent = f.head ? `${f.head} / ${f.origin || "–"}` : "–";
  $("sGitL").textContent = f.branch ? `${f.branch}: head / origin` : "head / origin";
  $("sAhead").textContent = f.ahead ?? "–";
}
async function poll() {
  try {
    const r = await fetch("api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const first = !LIVE;
    LIVE = true; lastLive = Date.now();
    const sig = JSON.stringify([d.steps, d.log.length, d.facts?.pushed]);
    live = d; headerFacts();
    if (first) document.querySelectorAll(".liveonly").forEach(x => x.style.display = "");
    if (sig !== lastSig) { lastSig = sig; render(); seenLog = d.log.length; }
  } catch {
    if (LIVE) { $("live").className = "live err"; $("liveT").textContent = "server lost, retrying"; }
  }
  tickLive();
}
function tickLive() {
  if (!LIVE) return;
  const s = Math.round((Date.now() - lastLive) / 1000);
  if (s < 10) { $("live").className = "live on"; $("liveT").textContent = `live · ${s}s ago`; }
}
if (location.protocol.startsWith("http")) { poll(); setInterval(poll, 3000); setInterval(tickLive, 1000); }
else document.querySelectorAll(".liveonly").forEach(x => x.style.display = "none");
// Runtimes keep ticking between changes.
setInterval(() => { if (LIVE && nodes.some(n => status(n) === "progress")) { lastSig = ""; } }, 60000);

// ---------- chips ----------
for (const [a, name] of Object.entries(PLAN.areas)) {
  const ch = document.createElement("span"); ch.className = "chip"; ch.tabIndex = 0;
  ch.innerHTML = `<span class="sw" style="background:var(--a-${a})"></span>${a} · ${esc(name)} <span class="muted">${nodes.filter(x => x.area === a).length}</span>`;
  ch.onclick = () => { areasOff.has(a) ? areasOff.delete(a) : areasOff.add(a); ch.classList.toggle("off"); render(); };
  $("chips").appendChild(ch);
}
$("chips").insertAdjacentHTML("beforeend", `<span class="sep"></span>
 <span class="key"><span class="sw" style="background:var(--done-fill);border-color:var(--done-ink)"></span>done</span>
 <span class="key"><span class="sw" style="background:var(--done-fill);border:1px dashed var(--done-ink)"></span>done, not pushed</span>
 <span class="key"><span class="sw" style="background:var(--prog-fill);border-color:var(--prog-ink)"></span>in progress</span>
 <span class="key"><span class="sw" style="background:var(--block-fill);border-color:var(--block-ink)"></span>blocked</span>
 <span class="key"><span class="sw" style="background:var(--ready-fill);border-color:var(--ready-ink)"></span>ready</span>
 <span class="key"><span class="sw" style="background:var(--wait-fill)"></span>waiting</span>
 <span class="key"><span class="sw" style="background:var(--edge-hi)"></span>needs</span>
 <span class="key"><span class="sw" style="background:var(--edge-lo)"></span>unblocks</span>`);

// ---------- pan / zoom ----------
const stage = $("stage"), vp = $("vp");
let tx = 0, ty = 0, k = 1;
const apply = () => vp.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`);
function fit() { const r = stage.getBoundingClientRect(); k = Math.min(r.width / WORLD_W, r.height / WORLD_H); tx = (r.width - WORLD_W * k) / 2; ty = (r.height - WORLD_H * k) / 2; apply(); }
function fitHeight() { const r = stage.getBoundingClientRect(); k = Math.min(1, Math.max(0.45, r.height / WORLD_H)); tx = 10; ty = (r.height - WORLD_H * k) / 2; apply(); }
function focusNode(n) { const r = stage.getBoundingClientRect(); k = Math.max(k, 0.9); tx = r.width / 2 - (n.x + W / 2) * k; ty = r.height / 2 - (n.y + H / 2) * k; apply(); }
stage.addEventListener("wheel", e => {
  e.preventDefault(); const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const nk = Math.min(3, Math.max(0.08, k * Math.exp(-e.deltaY * 0.0015)));
  tx = mx - (mx - tx) * nk / k; ty = my - (my - ty) * nk / k; k = nk; apply();
}, { passive: false });
let drag = null;
stage.addEventListener("pointerdown", e => { if (e.target.closest(".node") || tableOn) return; drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false }; stage.classList.add("drag"); });
addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; tx = drag.tx + dx; ty = drag.ty + dy; apply(); });
addEventListener("pointerup", () => { if (drag && !drag.moved && sel) { sel = null; render(); } drag = null; stage.classList.remove("drag"); });

// ---------- tooltip ----------
const tip = $("tip");
function showTip(n, e) {
  const en = entry(n.id), s = status(n);
  tip.innerHTML = `<b>${n.id}</b> · ${esc(n.title)}<br><span class="muted">${n.size}${n.hard ? ' · <span class="hard-ink">hard</span>' : ""} · <span class="${s}-ink">${label[s]}</span> · order ${n.step}${LIVE && en?.started ? " · " + runtime(en) : ""}</span><br>${esc(LIVE && en?.note ? en.note : n.done)}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + "px"; tip.style.top = (e.clientY + 14) + "px";
}

// ---------- controls ----------
const qEl = $("q");
qEl.addEventListener("input", () => { query = qEl.value.trim(); render(); });
qEl.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !query) return; const q = query.toLowerCase();
  const m = nodes.find(n => n.id.toLowerCase() === q) || nodes.find(n => n.id.toLowerCase().includes(q) || n.title.toLowerCase().includes(q));
  if (m) select(m.id, true);
});
const setFilter = f => { filter = filter === f ? null : f; $("bProg").setAttribute("aria-pressed", filter === "progress"); $("bReady").setAttribute("aria-pressed", filter === "ready"); render(); };
$("bProg").onclick = () => setFilter("progress");
$("bReady").onclick = () => setFilter("ready");
$("bCrit").onclick = () => { critOn = !critOn; $("bCrit").setAttribute("aria-pressed", critOn); render(); };
let tableOn = false;
$("bTable").onclick = () => { tableOn = !tableOn; $("table").style.display = tableOn ? "block" : "none"; $("bTable").setAttribute("aria-pressed", tableOn); render(); };
$("bFit").onclick = fit;
function drawTable() {
  $("table").innerHTML = `<table><thead><tr><th>#</th><th>Id</th><th>Level</th><th>Size</th><th>State</th><th>Step</th><th>Done when</th><th>After</th></tr></thead><tbody>${
    nodes.slice().sort((a, b) => a.step - b.step).map(n => `<tr data-go="${n.id}"><td>${n.step}</td><td><b>${n.id}</b></td><td>${n.level}</td><td>${n.size}${n.hard ? ' <span class="hard-ink">hard</span>' : ""}</td><td class="${status(n)}-ink">${label[status(n)]}</td><td>${esc(n.title)}</td><td>${esc(n.done)}</td><td>${n.deps.join(", ") || "-"}</td></tr>`).join("")}</tbody></table>`;
}
$("table").addEventListener("click", e => { const r = e.target.closest("[data-go]"); if (r) { sel = r.dataset.go; render(); } });
addEventListener("keydown", e => { if (e.key === "Escape" && document.activeElement !== qEl) { sel = null; render(); } else if (e.key === "Escape") { qEl.value = query = ""; render(); } });
fitHeight(); render();
</script>
</body>
</html>
