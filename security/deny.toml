# VELA dependency policy (cargo-deny: https://github.com/EmbarkStudios/cargo-deny)
# Install:  cargo install cargo-deny
# Run:      cargo deny --config security/deny.toml check   (from any workspace dir)
#
# Enforces what cargo-audit can't: bans, license checks, and a curated
# allowlist of the "allowed warnings" cargo-audit currently permits.
#
# Kept green on the current dep tree. When you bump/replace deps, the file
# should stay green — new duplicates or unallowed licenses will fail the gate.

[advisories]
# spin 0.9.8 is yanked but pinned transitively by multer/axum and can't be
# bumped without an upstream release. Tracked via cargo-audit (which still
# flags yanked crates) instead of hard-failing here.
yanked = "warn"
ignore = [
  # RUSTSEC-2024-0384 (instant unmaintained): transitive via UI deps; safe to
  # allow until the dep tree drops it.
  "RUSTSEC-2024-0384",
  # RUSTSEC-2025-0057 (fxhash unmaintained): transitive; replace with rustc-hash
  # when convenient. NOT a security advisory, just unmaintained.
  "RUSTSEC-2025-0057",
]

[bans]
multiple-versions = "deny"
skip-tree = [
  # crates where old versions are pinned by very common transitive deps
  "tokio",
  "hyper",
  "tower",
]
# Known duplicate versions across the five workspaces (crypto/async dep
# families). These are existing tech debt, not new regressions — anything NOT
# on this list that duplicates will fail the gate.
skip = [
  "base64", "block-buffer", "chacha20", "cpufeatures", "crypto-common",
  "digest", "fiat-crypto", "getrandom", "hashbrown", "keccak", "rand",
  "rand_core", "r-efi", "rustc-hash", "sha3", "thiserror", "thiserror-impl",
  "windows-sys", "wit-bindgen",
  # windows-rs per-arch/targets crates: duplicated whenever two windows-sys
  # minors coexist in the tree (currently 0.52/0.59/0.60/0.61). Same family as
  # the windows-sys skip above — empty platform crates, benign to allow.
  "windows-targets", "windows_aarch64_gnullvm", "windows_aarch64_msvc",
  "windows_i686_gnu", "windows_i686_gnullvm", "windows_i686_msvc",
  "windows_x86_64_gnu", "windows_x86_64_gnullvm", "windows_x86_64_msvc",
]
deny = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "MPL-2.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # added from the audited dep tree (all OSI/FSF-approved permissive)
  "BSL-1.0",              # clipboard-win / error-code
  "Zlib",                 # foldhash
  "CDLA-Permissive-2.0",  # webpki-root-certs
]
confidence-threshold = 0.8
