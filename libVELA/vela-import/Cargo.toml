[package]
name = "vela-import"
version = "0.1.0"
edition = "2021"
description = "Shared password-manager import parsing (Bitwarden, 1Password, KeePass, browsers, Proton, VELA)."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
base64 = "0.22"
# 1Password .1pux exports are ZIP archives; only inflate is needed to read them.
zip = { version = "9", default-features = false, features = ["deflate"] }
