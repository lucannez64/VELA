[package]
name = "vela-client-share-journal"
version = "0.1.0"
edition = "2021"
description = "Pure state machine for the desktop share journal (M28)"
license = "MIT OR Apache-2.0"

[lib]
name = "vela_client_share_journal"
path = "src/lib.rs"

[target.'cfg(hax)'.dependencies]
hax-lib = "=0.3.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hax)", "cfg(hax_compilation)"] }
