[package]
name = "vela-cli"
version = "0.1.0"
edition = "2021"
description = "VELA command line: vault access and an SSH agent"

[[bin]]
name = "vela"
path = "src/main.rs"

[dependencies]
vela-desktop-core = { path = "../vela-desktop-core" }
ed25519-dalek = "2"
rpassword = "7"
base64 = "0.22"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
