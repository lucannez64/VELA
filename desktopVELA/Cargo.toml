[workspace]
resolver = "2"
members = ["vela-desktop-core", "src-tauri", "src-gpui", "vela-e2e"]
# vendor/gpui-ce is its own separate workspace (vendored gpui-ce fork, see
# the [patch] section below) — excluded so Cargo doesn't try to fold its
# packages into this workspace's own dependency-inheritance resolution.
exclude = ["vendor/gpui-ce"]

[workspace.package]
edition = "2021"

# Profiles must live at the workspace root — Cargo ignores (and warns about)
# `[profile.*]` in member manifests. Both src-tauri and src-gpui carried this
# block back when each was its own workspace root; it lives here now so the
# fast-debug-build tuning keeps applying to both.
[profile.dev]
incremental = true
opt-level = 0
debug = true

# Dependencies at opt-level 1: the gpui tree is unusably slow when built fully
# unoptimized, and we don't step through it anyway.
[profile.dev.package."*"]
opt-level = 1
debug = false

# Local fork of the pinned gpui-ce revision (vendor/gpui-ce, vendored from
# the exact rev in Cargo.lock), carrying fixes not yet upstreamed:
#
#  1. `EditableTextState::replace_text_in_range`/`replace_and_mark_text_in_range`
#     (the real per-keystroke typing path) never called the crate's own
#     `scroll_to_caret()`, unlike `move_to`/`select_to` (arrow-key/click
#     navigation) which do — so typing text past a field's visible width never
#     scrolled to reveal the tail.
#
#  2. Keyboard accessibility for editable text (upstream's own backlog item).
#     Fields now register themselves as tab stops during paint, via a new
#     `Window::insert_tab_stop`, so `focus_next`/`focus_prev` can reach them;
#     and `insert_tab` / single-line `insert_enter` `cx.propagate()` instead of
#     silently eating the key, since an action handler stops propagation by
#     default. Without that, `tab` typed a literal tab with no way out of a
#     field, and `enter` was swallowed before any enclosing form could treat it
#     as submit. See `src-gpui/src/keyboard.rs` for the consuming side.
#
# All four crates from this git source must be patched together (not just
# gpui_elements) since they're one cohesive workspace with internal path deps —
# patching only one would produce two incompatible copies of `gpui`'s types in
# the same binary.
[patch."https://github.com/gpui-ce/gpui-ce"]
gpui = { path = "vendor/gpui-ce/crates/gpui" }
gpui_platform = { path = "vendor/gpui-ce/crates/gpui_platform" }
gpui_tokio = { path = "vendor/gpui-ce/crates/gpui_tokio" }
gpui_elements = { path = "vendor/gpui-ce/crates/gpui_elements" }
