[package]
name = "vela-gpui-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike crate — NOT part of any workspace, NOT wired into the
# desktopVELA build. See /home/hirew/.claude/plans/mighty-wibbling-wave.md
# Step 0. Proves: native Wayland window, gpui_tokio + existing tokio/quinn
# runtime-ordering, real crypto-backed VaultItem on screen, undecorated
# draggable window.

[dependencies]
gpui = { package = "gpui", git = "https://github.com/gpui-ce/gpui-ce" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce" }
gpui_tokio = { git = "https://github.com/gpui-ce/gpui-ce" }
vela-desktop = { path = "../src-tauri" }
tokio = { version = "1", features = ["rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 1
