[package]
name = "vela-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }
[dependencies]
tauri = { version = "2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-dialog = "2"
vela-desktop-core = { path = "../vela-desktop-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
parking_lot = "0.12"
once_cell = "1.19"
anyhow = "1.0"
getrandom = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http3"], default-features = false }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
vela-crypto = { path = "../../libVELA/vela-crypto" }
data-encoding = "2"
subtle = "2"
url = "2"
base64 = "0.22"
urlencoding = "2"
hex = "0.4"
scraper = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7.0", features = ["background_threads"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
