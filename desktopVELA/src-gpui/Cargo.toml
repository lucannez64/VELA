[package]
name = "vela-desktop-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { package = "gpui", git = "https://github.com/gpui-ce/gpui-ce" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce" }
gpui_tokio = { git = "https://github.com/gpui-ce/gpui-ce" }
gpui_elements = { git = "https://github.com/gpui-ce/gpui-ce" }
vela-desktop-core = { path = "../vela-desktop-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3"
chrono = "0.4"
base64 = "0.22"
open = "5"
qrcode = "0.14"
image = "0.25.1"
rfd = "0.15"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7.0", features = ["background_threads"] }

[profile.dev]
incremental = true
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 1
debug = false
