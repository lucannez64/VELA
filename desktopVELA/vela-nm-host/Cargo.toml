[package]
name = "vela-nm-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "vela_nm_host"
path = "src/lib.rs"

[[bin]]
name = "vela-native-messaging-host"
path = "src/bin/vela-native-messaging-host.rs"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# getuid() for the per-user endpoint name.
libc = "0.2"

[package.metadata.notes]
security = "The browser spawns this binary over stdio. It relays to the desktop's well-known per-user endpoint; there is no capability file and no shared secret (issue #149, option B)."

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "macros"] }
vela-desktop-core = { path = "../vela-desktop-core" }
