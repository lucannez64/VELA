[package]
name = "vela-desktop-core"
version = "0.1.0"
edition = "2021"

# Toolkit-agnostic desktop backend: crypto, vault storage, sync/HTTP client,
# device/biometric key handling, the local autofill IPC bridge, and the
# Wayland global-shortcut portal client. No Tauri (or any other UI toolkit)
# dependency — both `src-tauri` and the future `src-gpui` binary link this.
# See /home/hirew/.claude/plans/mighty-wibbling-wave.md Step 1.

[features]
default = []
# The M9c experiment: a JS runtime inside the core, for logins on sites that
# submit by `fetch` rather than by form. Off by default and likely to stay that
# way — see `security/formal/m9c_inprocess_sandbox.spthy` for what it costs, and
# src/js_login.rs for the two design choices that make this variant defensible.
js-login = ["dep:boa_engine"]
# The browser-driven login tier: a disposable real browser (Chrome/Chromium/
# Edge) driven by the core over CDP (via the debugging pipe, not a TCP port),
# so bot-walled sites can be logged into while the password never enters the
# page's JavaScript. See `security/browser-driven-login-design.md`. Off by
# default, deliberately.
browser-login = []

# These diagnostics import the feature-gated browser driver directly. Declaring
# the requirement here makes ordinary `cargo test` skip them while preserving
# their documented `cargo run --features browser-login --example ...` usage.
[[example]]
name = "capture_login"
required-features = ["browser-login"]

[[example]]
name = "inspect_page"
required-features = ["browser-login"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Pure Rust on purpose. M9c's escape rule assumes a C interpreter where a JS
# bug becomes memory corruption in the process holding the vault; a memory-safe
# engine is a different threat model, and the one worth prototyping against.
boa_engine = { version = "0.21", optional = true }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
anyhow = "1.0"
getrandom = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http3"], default-features = false }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
# WebAuthn credential keys (ES256). Kept out of vela-crypto on purpose so the
# server, which depends on that crate and has no passkeys, does not carry an
# ECDSA stack. See src/credential_key.rs.
p256 = { version = "0.13", features = ["ecdsa"] }
vela-crypto = { path = "../../libVELA/vela-crypto" }
vela-client-recovery-policy = { path = "../../libVELA/vela-client-recovery-policy" }
vela-sync-policy = { path = "../../libVELA/vela-sync-policy" }
directories = "5"
data-encoding = "2"
subtle = "2"
url = "2"
psl = "2.1.213"
base64 = "0.22"
hex = "0.4"
scraper = "0.23"
once_cell = "1.19"
urlencoding = "2"
ctap-hid-fido2 = "3.5"
ciborium = "0.2"
# Client-side RSA for the Steam login recipe, done in the core in Rust so the
# password never has to enter a JavaScript runtime to be encrypted — see
# src/login/recipe.rs and security/in-core-login-future-work.md (§3, Tier B).
rsa = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
# The browser-driven login tier's CDP client drives the browser over the
# debugging pipe (fds 3/4, JSON-RPC framed as u32-len + payload in both
# directions); it needs no WebSocket dependency.
# Stream/Sink helpers (used by the Wayland short-cut client; the CDP pipe
# transport is plain tokio IO).
futures-util = "0.3.33"
# Pinned to match serverVELA/Cargo.lock's webauthn-rs (which depends on this
# exact version of its own wire-format companion crate) — using the same
# crate for both sides means the JSON shapes match by construction instead
# of by hand-transcription.
webauthn-rs-proto = "=0.5.5"

[target.'cfg(unix)'.dependencies]
# SO_PEERCRED / LOCAL_PEERCRED on the IPC socket, so a caller is identified by
# the kernel rather than by a bearer token it may have read off disk (audit D-4).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
arboard = "3"
windows = { version = "0.58", features = [
    # Windows Hello: UserConsentVerifier plus the Win32 interop that a desktop
    # (non-packaged) app needs to parent the prompt to its own window.
    "Security_Credentials_UI",
    "Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    # The IPC gate walks the connecting process's lineage (parent pid lookup)
    # to verify a browser spawned our native messaging host — issue #149, B.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# `wayland-data-control` is not a default feature, and without it arboard has
# no Wayland backend at all — see src/clipboard.rs.
arboard = { version = "3", features = ["wayland-data-control"] }
# Only for the data-control capability probe in src/clipboard.rs (already in
# the tree as arboard's Wayland backend).
wl-clipboard-rs = "0.9"
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-io = "2"
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3"
security-framework = "3"
# Touch ID / Face ID: LocalAuthentication for the user-presence evaluation, and
# the raw Security keys so the evaluated LAContext can be handed to the Keychain
# read (one prompt instead of two).
security-framework-sys = "2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "LABiometryType"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# A real WebAuthn relying party, used to verify our ceremony output rather than
# trusting our own encoder to agree with itself. Same crate and version the
# server uses. See src/passkey_rp_test.rs.
webauthn-rs = "0.5.4"
uuid = { version = "1.0", features = ["v4"] }
