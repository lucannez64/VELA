<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELA · The Vault Atlas</title>
<style>
  :root{
    --paper:#cfc9a1;
    --paper-2:#c7c199;
    --ink:#16160f;
    --ink-2:rgba(22,22,15,.62);
    --ink-3:rgba(22,22,15,.34);
    --rule:rgba(22,22,15,.30);
    --rule-soft:rgba(22,22,15,.16);
    --mono: "Berkeley Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--mono); font-size:12px; line-height:1.45;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  ::selection{background:var(--ink);color:var(--paper)}

  /* ── shell ───────────────────────────────────────────────── */
  #shell{display:grid; grid-template-rows:auto 1fr; height:100vh; width:100vw; overflow:hidden}
  #topbar{
    display:flex; align-items:stretch; border-bottom:1px solid var(--ink);
    min-height:44px; min-width:0; overflow:hidden;
  }
  #statbar{display:flex; align-items:stretch; flex:1 1 auto; min-width:0; overflow:hidden}
  .stat{padding:5px 13px 6px; border-right:1px solid var(--rule); white-space:nowrap}
  .stat:first-child{border-right:1px solid var(--ink)}
  .stat .k{font-size:9.5px; letter-spacing:.14em; color:var(--ink-2); text-transform:uppercase}
  .stat .v{font-size:14px; letter-spacing:.01em}
  .stat.wide .v{font-size:15px}
  #statbar .spring{flex:1 1 auto; border-right:none; min-width:0}
  #controls{display:flex; align-items:center; gap:7px; padding:0 12px 0 8px; flex:0 0 auto;
            border-left:1px solid var(--ink)}
  .btn{
    border:1px solid var(--ink); padding:5px 10px; font-size:10px;
    letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
  }
  .btn:hover{background:rgba(22,22,15,.09)}
  .btn.on{background:var(--ink); color:var(--paper)}

  #body{display:grid; grid-template-columns:214px minmax(0,1fr) 400px; min-height:0; min-width:0}
  #sidebar{border-right:1px solid var(--ink); overflow-y:auto; padding:6px 0 40px}
  #stage{position:relative; overflow:hidden}
  #panel{border-left:1px solid var(--ink); display:grid; grid-template-rows:auto 1fr; min-height:0}

  /* ── sidebar ─────────────────────────────────────────────── */
  .sec{font-size:9.5px; letter-spacing:.16em; color:var(--ink-2); padding:12px 10px 5px; text-transform:uppercase}
  .sec:first-child{padding-top:6px}
  .row{
    display:grid; grid-template-columns:16px 1fr auto; gap:7px; align-items:start;
    margin:2px 6px; padding:5px 7px; border:1px solid var(--ink); cursor:pointer;
  }
  .row.sub{margin-left:16px; border-color:var(--rule)}
  .row:hover{background:rgba(22,22,15,.10)}
  .row.sel{background:var(--ink); color:var(--paper)}
  .row .key{font-size:10px; opacity:.72}
  .row .nm{font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; word-break:break-word}
  .row .ct{font-size:10px; opacity:.62}

  /* ── stage ───────────────────────────────────────────────── */
  #scene{display:block; width:100%; height:100%; cursor:grab}
  #scene.drag{cursor:grabbing}
  #zoombox{position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:5px}
  .zb{width:26px;height:26px; border:1px solid var(--ink); display:grid; place-items:center; font-size:14px; background:var(--paper)}
  .zb:hover{background:rgba(22,22,15,.10)}
  #hint{
    position:absolute; left:0; right:0; bottom:0; padding:7px 16px;
    font-size:10px; letter-spacing:.1em; color:var(--ink-2); text-transform:uppercase;
    pointer-events:none;
  }
  #breadcrumb{
    position:absolute; top:10px; left:14px; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-2); pointer-events:none;
  }
  #tip{
    position:absolute; pointer-events:none; max-width:280px; padding:6px 9px;
    background:var(--paper); border:1px solid var(--ink); font-size:10.5px; display:none;
    box-shadow:3px 3px 0 rgba(22,22,15,.16);
  }
  #tip .t{letter-spacing:.09em; text-transform:uppercase}
  #tip .d{color:var(--ink-2); margin-top:3px}

  /* ── inspector ───────────────────────────────────────────── */
  #inspector{
    position:absolute; left:14px; bottom:34px; width:410px; max-height:62%;
    background:var(--paper); border:1px solid var(--ink); display:none;
    box-shadow:4px 4px 0 rgba(22,22,15,.18); flex-direction:column; overflow:hidden;
  }
  #inspector.open{display:flex}
  #inspector .head{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 10px; background:var(--ink); color:var(--paper)}
  #inspector .head .lbl{font-size:10px; letter-spacing:.14em; text-transform:uppercase}
  #inspector .head .x{font-size:13px; line-height:1}
  #inspector .meta{padding:8px 10px 4px; border-bottom:1px solid var(--rule-soft)}
  #inspector .route{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
  #inspector .title{font-size:14px; margin-top:2px}
  #inspector .bodywrap{overflow:auto; padding:8px 10px 10px}
  #inspector pre{
    margin:0; font:inherit; font-size:11px; white-space:pre-wrap; word-break:break-word;
    background:rgba(22,22,15,.055); border-left:2px solid var(--ink); padding:7px 9px;
  }
  #inspector .note{margin-top:8px; color:var(--ink-2); font-size:11px}
  #inspector .src{margin-top:8px; font-size:10px; color:var(--ink-2)}
  #inspector .nav{display:flex; gap:6px; padding:7px 10px; border-top:1px solid var(--rule-soft)}

  /* ── right panel ─────────────────────────────────────────── */
  #tabs{display:flex; border-bottom:1px solid var(--ink)}
  .tab{flex:1; padding:8px 10px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; text-align:center}
  .tab.on{background:var(--ink); color:var(--paper)}
  #panelbody{overflow-y:auto; padding:14px 18px 60px}
  #panelbody h1{font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-2); font-weight:400; margin:0 0 4px}
  #panelbody h2{font-size:22px; font-weight:400; letter-spacing:-.01em; margin:0 0 4px; line-height:1.15}
  #panelbody .sub{color:var(--ink-2); margin:0 0 16px}
  #panelbody h3{
    font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-2);
    font-weight:400; margin:20px 0 7px; padding-bottom:5px; border-bottom:1px solid var(--rule);
  }
  #panelbody p{margin:0 0 11px; font-size:12.5px; line-height:1.62}
  #panelbody .mk{background:var(--ink); color:var(--paper); padding:0 4px}
  #panelbody ul{margin:0 0 11px; padding-left:15px}
  #panelbody li{margin-bottom:5px; font-size:12px; line-height:1.55}
  #panelbody .file{font-size:11px; color:var(--ink-2); margin-bottom:3px}
  #panelbody .chip{
    display:inline-block; border:1px solid var(--ink); padding:2px 7px; margin:0 4px 4px 0;
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
  }
  #panelbody .chip:hover{background:var(--ink); color:var(--paper)}
  #panelbody .go{
    display:inline-block; margin-top:4px; border-bottom:1px solid var(--ink);
    font-size:11px; letter-spacing:.06em; cursor:pointer;
  }
  #panelbody .cond{border-left:2px solid var(--ink); padding:2px 0 2px 10px; margin-bottom:9px; font-size:12px}
  #panelbody table{width:100%; border-collapse:collapse; margin-bottom:12px}
  #panelbody td{padding:3px 0; font-size:11.5px; vertical-align:top; border-bottom:1px solid var(--rule-soft)}
  #panelbody td.k{color:var(--ink-2); width:44%; padding-right:8px}
</style>
</head>

<div id="shell">
  <div id="topbar"></div>
  <div id="body">
    <div id="sidebar"></div>
    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="breadcrumb"></div>
      <div id="zoombox">
        <button class="zb" data-z="in">+</button>
        <button class="zb" data-z="out">&minus;</button>
      </div>
      <div id="tip"></div>
      <div id="inspector">
        <div class="head"><span class="lbl">Packet inspector</span><button class="x" id="insp-close">&times;</button></div>
        <div class="meta"><div class="route" id="insp-route"></div><div class="title" id="insp-title"></div></div>
        <div class="bodywrap">
          <pre id="insp-body"></pre>
          <div class="note" id="insp-note"></div>
          <div class="src" id="insp-src"></div>
        </div>
        <div class="nav">
          <button class="btn" id="insp-prev">&larr; Prev hop</button>

        </div>
      </div>
      <div id="hint">&rarr; go inside &middot; &larr; come back out &middot; &darr;&uarr; move &middot; hover to read &middot; click a dot to inspect it &middot; drag to pan &middot; scroll to zoom</div>
    </div>
    <div id="panel">
      <div id="tabs">
        <button class="tab on" data-tab="what">What it does</button>
        <button class="tab" data-tab="built">How it's built</button>
      </div>
      <div id="panelbody"></div>
    </div>
  </div>
</div>
<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   THE MODEL — every number, path and payload below was read out of this
   repository. Nothing here is illustrative filler.
   ══════════════════════════════════════════════════════════════════════ */

const STATS = [
  { k:"repository",     v:"vela · local-first vault", wide:true },
  { k:"rust crates",    v:"13" },
  { k:"rust",           v:"84,554 lines" },
  { k:"other clients",  v:"kotlin · swift · ts · wasm" },
  { k:"server routes",  v:"54" },
  { k:"tauri commands", v:"47" },
  { k:"front ends",     v:"2 — one still being ported" },
  { k:"traced flows",   v:"12" },
];

const OVERVIEW = {
  title:"The Vault Atlas",
  sub:"how a secret gets sealed, stored, synced and handed back",
  what:[
    "VELA is a **zero-knowledge** password vault. The whole design follows from one rule: the server may hold your data but must never be able to read it. Everything in this map is downstream of that.",
    "The **loop** across the top is the unlock path — master password → Argon2id → the Root Master Seed → a BLAKE3 fan-out of purpose-bound keys → XChaCha20-Poly1305 → the vault in memory. The RMS is the only secret; every other key in the system is derived from it with a context string, so no key can be reused for the wrong job. The seed can now rotate: every ciphertext and device capsule moves from epoch N to N+1 without revealing either seed to the server.",
    "Below the loop is what the vault talks to: a **sync engine** that probes the account key epoch before touching chunks, an IPC socket the browser extension speaks through, device identity keys that authenticate to the server, and a 2-of-3 Shamir split that is re-minted after rotation.",
    "To the right is **serverVELA** — an Axum router in front of sled and Turso. It sees ciphertext, signatures, epochs and revocation state. It never sees a vault item, an RMS, or a private key.",
    "Nearly every hard problem here turned out to be a **trust-boundary** problem rather than a cryptography one: how a brand-new device proves it is the user's, how a browser extension proves it is the extension, how a client can tell a stale blob from a replayed one. The tall structures are the parts that decide who is allowed what.",
  ],
  built:[
    "One Cargo workspace per surface: `libVELA` holds the shared crypto and the platform bridges, `desktopVELA` holds core + two front ends, `serverVELA` holds the API. Clients built on Kotlin, Swift, TypeScript and WASM all call back into the same Rust core through bridges rather than reimplementing crypto.",
    "Primitives are hybrid post-quantum throughout: **ML-KEM-1024 + X25519** for encapsulation, **ML-DSA-87 + Ed25519** for device signatures. Both halves must verify; either alone is enough against a partial adversary.",
    "The moving dots are real payloads. Click one to read the exact bytes crossing that wire, and the file that puts them there.",
  ],
  cond:[
    "The Rust server speaks plain HTTP. TLS is expected to terminate in front of it; in production a request that cannot be proven HTTPS is rejected with 426.",
    "Two desktop front ends exist in parallel — React-on-Tauri is what ships, the gpui port is still being brought level. Both drive the same core; the Tauri layer is wrappers only.",
    "RMS rotation and epoch adoption currently ship in the desktop core only. Active Android or iOS devices therefore block rotation, and enrolling either mobile client after epoch 1 is unsupported: their chunk sync does not yet bind the epoch into AEAD or send `X-Vela-Epoch`.",
    "Accounts with persisted Path ORAM buckets cannot rotate yet; `/vault/rekey/start` refuses them rather than migrate an incomplete shadow tree.",
  ],
};

/* ── groups ────────────────────────────────────────────────────────── */
const GROUPS = [
  { id:"unlock",   name:"The unlock path" },
  { id:"vault",    name:"The vault" },
  { id:"identity", name:"Identity & devices" },
  { id:"recovery", name:"Recovery" },
  { id:"server",   name:"The server" },
  { id:"clients",  name:"What talks to it" },
];

/* ── nodes ─────────────────────────────────────────────────────────────
   gx,gy = grid origin · w,d = footprint · h = height (tall = it decides
   something; flat = it stores something).                              */
const NODES = [
/* ---- unlock path ---- */
{ id:"PWD", key:"P", label:"Master password", group:"unlock", gx:0, gy:0, w:2, d:2, h:1.3,
  files:["desktopVELA/src/views/BiometricGate.tsx","desktopVELA/src-gpui/src/views/biometric_gate.rs","libVELA/vela-core/src/password.rs"],
  what:["The only thing the user actually knows. It is never stored, never sent, and never hashed with a fast hash — it exists just long enough to open the sealed seed, then it is zeroized.",
        "The same module scores passwords the generator makes: `calculate_password_strength` and `password_entropy` are what the strength meter reads."],
  built:["Held in a `Zeroizing<String>` and handed straight to `password_kdf::open_with_password`. On desktop the prompt sits behind the biometric gate, so most unlocks never type it at all."],
  cond:[],
  inside:[["read","prompt or biometric gate returns a Zeroizing<String>"],["measure","password_entropy → strength_verdict for the meter"],["hand off","open_with_password(blob, password)"],["wipe","Zeroizing drop on scope exit"]] },

{ id:"ARG", key:"A", label:"Argon2id seal", group:"unlock", gx:4, gy:0, w:2, d:2, h:3.4,
  files:["libVELA/vela-crypto/src/password_kdf.rs"],
  what:["The wall between a stolen laptop and the vault. The sealed RMS blob is an **offline brute-force target**, so the password goes through Argon2id with a per-blob random salt rather than any fast hash.",
        "Blobs are versioned and self-describing. v3 records the cost parameters it was sealed with, so raising the cost never becomes a flag day: old blobs keep opening at the cost they were written at, and `needs_reseal` tells the caller to upgrade one."],
  built:["`\"VRMS\" ‖ 3 ‖ m_cost:u32 ‖ t_cost:u32 ‖ p_cost:u32 ‖ salt[16] ‖ ciphertext`. Default cost 64 MiB / t=3 / p=1, with a 19 MiB / t=2 interactive profile. Legacy blobs (plain BLAKE3, no magic header) are detected by the caller and lazily re-sealed after a successful open."],
  cond:["Legacy pre-v2 blobs still open, by design, until the lazy migration has re-sealed them."],
  inside:[["parse","magic VRMS + version byte"],["params","m_cost / t_cost / p_cost from the blob, not from the binary"],["derive","Argon2id(password, salt) → 32-byte key"],["open","XChaCha20-Poly1305 over the ciphertext"],["needs_reseal","compare stored cost against current default"]] },

{ id:"RMS", key:"R", label:"Root master seed", group:"unlock", gx:8, gy:0, w:2, d:2, h:4.8,
  files:["libVELA/vela-crypto/src/kdf.rs","libVELA/vela-crypto/src/rekey.rs","desktopVELA/vela-desktop-core/src/crypto.rs"],
  what:["32 bytes. **Every key in VELA descends from these.** Losing them loses the vault; leaking them loses everything at once, which is why they are the tallest thing on the map and the shortest-lived thing in memory.",
        "The RMS never travels in the clear. To reach a second device — including one adopting a new key epoch — it is sealed to that device's public KEM key; to survive a lost device it is split three ways with Shamir."],
  built:["Generated from the OS RNG at account creation and again on every vault-key rotation. At rest it lives only inside the Argon2id blob (`rms_software.enc`) or an OS-credential store. In memory it is held behind the session lock and dropped on lock."],
  cond:["Whether the seed sits in the OS keychain or in a software blob depends on platform capability, so the offline attack surface is not identical everywhere."],
  inside:[["generate","getrandom → [u8;32]"],["rotate","fresh RMS for epoch N+1"],["seal","password_kdf::seal_with_password"],["derive","kdf::derive(context, rms) for every subkey"],["escrow","shamir::split(rms, 2, 3)"],["transfer","KEM seal to a joining or adopting device"]] },

{ id:"KDF", key:"K", label:"BLAKE3 key fan-out", group:"unlock", gx:12, gy:0, w:3, d:2, h:3.2,
  files:["libVELA/vela-crypto/src/kdf.rs"],
  what:["One seed in, nine **domain-separated** keys out. Each derivation is tagged with a context string, so the vault key can never accidentally be used as the audit-log key or the share key.",
        "Per-chunk keys go one step further: `chunk_key(rms, chunk_id)` mixes the chunk id in, so a chunk's key is useless against any other chunk."],
  built:["BLAKE3 native KDF mode. Contexts in the tree today: vault encryption, chunk key, device identity, identity signing, audit log, MAC, share encryption, ORAM position map, and 32 web-session chunk keys."],
  cond:[],
  inside:[["vault_encryption_key","\"vela vault encryption v1\""],["chunk_key","context + chunk_id"],["audit_log_key","\"vela audit log v1\""],["mac_key","\"vela mac key v1\""],["share_encryption_key","\"vela share encryption v1\""],["oram_position_map_key","\"vela oram position map v1\""],["device_identity_key_seed","\"vela device identity v1\""],["identity_signing_key_seed","\"vela identity signing v1\""],["web_session_chunk_keys","32 ids, one key each"]] },

{ id:"AED", key:"E", label:"XChaCha20 AEAD", group:"unlock", gx:16, gy:0, w:2, d:2, h:2.5,
  files:["libVELA/vela-crypto/src/aead.rs","libVELA/vela-crypto/src/rekey.rs"],
  what:["Every blob that leaves the process goes through here. A fresh **192-bit random nonce** is prepended to the ciphertext so the nonce always travels with what it protects — there is no nonce counter to get wrong.",
        "Vault chunks are sealed with associated data binding the account key epoch, chunk id and Lamport clock, so a server that crosses epochs, relabels or replays a blob produces a decryption failure rather than a silent rollback."],
  built:["XChaCha20-Poly1305. Overhead is 40 bytes: 24-byte nonce + 16-byte tag. Sealed-with-AAD blobs carry the magic `VAE1` so `is_sealed` can tell the two envelope generations apart during migration."],
  cond:["Epoch 1 accepts the legacy chunk-id + Lamport AAD for rolling compatibility. Every later epoch requires the explicit epoch binding."],
  inside:[["epoch_aad","\"vela epoch v1\" ‖ epoch ‖ chunk_id ‖ lamport_clock"],["seal","nonce[24] ‖ ct ‖ tag[16]"],["open","epoch or revision mismatch = hard failure"],["is_sealed","VAE1 magic probe for migration"]] },

/* ---- the vault ---- */
{ id:"VLT", key:"V", label:"Vault store", group:"vault", gx:16, gy:4, w:4, d:3, h:1.1,
  files:["libVELA/vela-core/src/vault.rs","desktopVELA/vela-desktop-core/src/vault.rs"],
  what:["The decrypted items, in memory, for as long as the session is unlocked. Six item types: login, credit card, secure note, identity, file blob, breach monitor.",
        "It also owns **URL matching** — deciding whether a stored login belongs to the page asking for it. That check uses the Public Suffix List rather than a last-two-labels shortcut, which used to collapse `victim.co.uk` to a public suffix that matched nothing."],
  built:["Serde-tagged enum over a shared `VaultMeta` (id, name, timestamps, last-modified device, favourite, shared). Deletions are `Tombstone` records, not removals, so a delete can propagate to other devices instead of being resurrected by the next merge."],
  cond:["Item plaintext lives in process memory while unlocked; the protection there is the session lock and zeroization, not the OS."],
  inside:[["items","Vec<VaultItem>, tagged by item_type"],["tombstones","deletions retained for propagation"],["urls_match","PSL-aware host comparison"],["linked apps","androidapp://<package> entries"],["breach fields","hibp state carried on the item"]] },

{ id:"STO", key:"S", label:"Encrypted local store", group:"vault", gx:16, gy:9, w:3, d:3, h:0.65,
  files:["desktopVELA/vela-desktop-core/src/store.rs"],
  what:["What survives a restart. Nothing secret lands here in plaintext: the vault, audit log, share list, conflict list, recovery setup and authenticated key epoch are sealed before they touch disk.",
        "A seed rotation is crash-resumable. Before any consumer changes, a durably synced two-way migration journal seals RMS N+1 under RMS N and RMS N under RMS N+1; either endpoint can then finish a mixed on-disk migration after a crash."],
  built:["Per-file envelopes (`vault.enc`, `audit.enc`, `shares.enc`, `sync_conflicts.enc`, `recovery_setup.enc`, `key_epoch.enc`) use temp-file + rename writes. `rms_migration.json` is retained until files, platform/password RMS wrappers and epoch markers are synced under the new seed."],
  cond:["A file's freshness on disk is not authenticated against the server's view — rollback protection lives in the sync engine's Lamport check, not here."],
  inside:[["vault.enc","sealed items"],["audit.enc","sealed local audit trail"],["shares.enc","sealed inbox / linked shares"],["sync_conflicts.enc","sealed unresolved merges"],["key_epoch.enc","epoch authenticated by the current RMS"],["rms_migration.json","two-way old ↔ new RMS recovery bridge"]] },

{ id:"SYN", key:"C", label:"Sync engine", group:"vault", gx:11, gy:9, w:3, d:3, h:3.8,
  files:["desktopVELA/vela-desktop-core/src/sync.rs","desktopVELA/src-tauri/src/commands/sync.rs"],
  what:["The hardest module in the client, because it has to merge two vaults **without trusting the thing in the middle**.",
        "Every chunk carries a Lamport clock; each writer sets `max(previous, local) + 1`. A clock that comes back *lower* than what this device already recorded is not a stale cache, it is a rollback attempt — and it is refused.",
        "Before any manifest, read or write it probes `/vault/epoch`. If the server is ahead, the device opens its retained KEM capsule and migrates every local RMS consumer before sync continues; a lower server epoch is refused as rollback.",
        "Merges honour tombstones so deletions propagate, and anything genuinely divergent becomes a conflict the user resolves rather than a silent overwrite."],
  built:["Serialised behind a sync mutex so local edits cannot interleave with a merge or RMS adoption. It captures the session generation before starting and aborts if the vault is locked mid-flight. A 401 triggers exactly one re-authentication and retry, because a 15-minute server token routinely outlives an idle unlocked app."],
  cond:["Conflicts cannot be listed or resolved while the vault is locked — they are stored encrypted, so there is nothing to show.","Desktop is the only client that currently implements epoch-capsule adoption and epoch-bound chunk sync."],
  inside:[["trigger_sync","take the mutex, capture session generation"],["epoch probe","GET /vault/epoch before vault traffic"],["adopt","open retained capsule; journal files + RMS wrappers"],["manifest","GET /vault/sync → epoch + chunk_id, version, lamport_clock, last_writer"],["rollback guard","refuse lamport < last seen or server epoch < local"],["open","AEAD with epoch ‖ chunk_id ‖ lamport as AAD"],["merge","tombstone-aware, per item"],["conflicts","divergent items → sync_conflicts.enc"],["push","PUT with If-Match + X-Vela-Epoch"],["prune","drop tombstones past retention"]] },

{ id:"RKY", key:"RK", label:"Vault key rotation", group:"vault", gx:11, gy:5, w:3, d:2, h:4.2,
  files:["libVELA/vela-crypto/src/rekey.rs","desktopVELA/vela-desktop-core/src/commands/rekey.rs","serverVELA/vela-server/src/vault/rekey.rs","docs/VAULT_REKEYING_DESIGN.md"],
  what:["The account-wide operation that makes a leaked Root Master Seed expire. One capable desktop creates RMS N+1, re-seals every current chunk into shadow rows, KEM-seals the new seed to every active device, then atomically advances the account epoch.",
        "The server never handles either RMS. It coordinates an **ACTIVE(N) → FREEZING(N→N+1) → ACTIVE(N+1)** state machine and verifies completeness before the compare-and-swap commit."],
  built:["Rotation is serialized with ordinary sync and requires an explicit human confirmation. The server returns an inventory and a random rotation id, accepts only starter-authenticated shadow writes at the target epoch, requires one shadow per current chunk plus one capsule per active device, and rolls an abandoned freeze back after 15 minutes."],
  cond:["Every active device must have retained its capsule private key and advertised desktop re-key capability. Android/iOS do not yet advertise it.","Rotation is refused while any Path ORAM bucket exists.","Fresh recovery shares are generated and verified after adoption, but cloud upload, FIDO2 registration and trusted-contact delivery must be performed again."],
  inside:[["presence","confirm outside the requesting renderer"],["start","freeze N; inventory chunks and active devices"],["rotate","OS RNG → RMS N+1"],["shadow","re-seal every chunk with epoch N+1 AAD"],["fan-out","KEM capsule for every active capable device"],["commit","completeness check + epoch CAS"],["migrate local","durable journal, files and RMS wrappers"],["recovery","re-mint 2-of-3 shares; repeat delivery"]] },

{ id:"ORM", key:"O", label:"Path ORAM", group:"vault", gx:21, gy:6, w:2, d:2, h:4.0,

{ id:"IDN", key:"I", label:"Device identity", group:"identity", gx:7, gy:13, w:2, d:2, h:3.4,
  files:["libVELA/vela-crypto/src/identity.rs","libVELA/vela-crypto/src/signing.rs"],
  what:["What makes a device *this* device. A long-term hybrid signing key authenticates it to the server; a separate decapsulation key opens everything shared with it.",
        "These keys used to be handed to the app as base64 in a JVM or Swift `String` — immutable, possibly interned, never zeroized, and therefore still readable in a heap dump long after use. Now the material is created, used and destroyed **on the Rust side of the FFI**: callers get an opaque handle and the public halves, and persist a sealed blob they cannot read."],
  built:["ML-DSA-87 (FIPS 204) + Ed25519, mirroring the KEM's level-5 hybrid. Both signatures must verify. `fips204` is used rather than RustCrypto's `ml-dsa`, which carries a timing side-channel advisory through v0.0.4. The only bytes crossing the FFI are a 32-byte sealing key — an array both sides can wipe, unlike a string."],
  cond:["ML-DSA-87 is software-only today; only the Ed25519 half can live in a hardware enclave."],
  inside:[["generate","hybrid signing + share keypairs"],["publics","IdentityPublics handed out; privates stay"],["sign_auth","device_id ‖ challenge → 4,691-byte hybrid signature"],["open_share","decapsulate a capsule sealed to this device"],["enrollment_fingerprint","short digest the user compares"],["rotate_share_key","new share keypair, same identity"],["seal","opaque blob for persistence"]] },

{ id:"ENR", key:"N", label:"Enrollment v3", group:"identity", gx:15, gy:13, w:3, d:2, h:3.6,
  files:["desktopVELA/vela-desktop-core/src/commands/enrollment_v3.rs","serverVELA/vela-server/src/device/rendezvous.rs"],
  what:["The trust-bootstrap moment: an account with one device gets a second one, and **there is no pre-existing trust root to check a signature against**.",
        "v2 sealed the seed under a symmetric transfer key that travelled inside the enrollment code, so reading the code was enough to open the capsule. v3 seals it to a public KEM key whose private half never left the joining device — intercepting both the code and the capsule now gets you nothing.",
        "Claim and result are deliberately unauthenticated: the joining device has no identity yet, which is the entire point. Its binding comes from the grant being single-claim, and from a signature under the key it claimed with."],
  built:["Grant → claim → fingerprint comparison → complete → result, four routes on the server and a state machine on both devices. Pending grants, invites and joins are held in memory only: a restart mid-enrollment means starting over rather than resuming a comparison the user never finished."],
  cond:["The user has to actually compare the fingerprints. The protocol makes substitution detectable, not impossible."],
  inside:[["post_grant","opening device creates a single-claim grant"],["claim","joining device posts hybrid_ek + hybrid_vk"],["fingerprint","both sides derive the same short code"],["user compares","the only human step in the protocol"],["complete","RMS sealed to the claimed KEM key"],["post_result","signature over grant_id → device_id"]] },

{ id:"SAS", key:"F", label:"Verification codes", group:"identity", gx:19, gy:13, w:2, d:2, h:1.7,

  inside:[["locator","VELA-ENROLL:v2:<server>:<token>:<key>"],["digest","hash the exact string, both sides"],["render","short comparable code"],["compare","human check before import"]] },

{ id:"TOK", key:"T", label:"Session tokens", group:"identity", gx:7, gy:5, w:2, d:2, h:2.2,
  files:["desktopVELA/vela-desktop-core/src/token.rs","serverVELA/vela-server/src/auth/token.rs"],

/* ---- recovery ---- */
{ id:"SHM", key:"M", label:"Shamir 2-of-3", group:"recovery", gx:7, gy:17, w:2, d:2, h:2.8,
  files:["libVELA/vela-crypto/src/shamir.rs","libVELA/vela-crypto/src/rekey.rs"],
  what:["Losing every device must not mean losing the vault, and no single custodian may be able to restore it alone. So the 32-byte seed is split three ways: **cloud backup, the VELA server behind a FIDO2-bound key, and a trusted contact.** Any two reconstruct it; any one is nothing."],
  built:["Sharing over GF(2^8) with the AES irreducible polynomial, byte by byte, with a degree-(t−1) polynomial. Shares serialise as `(x, y_0…y_31)` plus a 16-byte MAC so a corrupted share is caught rather than silently reconstructing garbage. After an RMS rotation, a fresh split is reconstructed and compared with RMS N+1 before delivery begins."],
  cond:["The trusted-contact share has no delivery channel the app can verify — it is shown to the user, who says they handed it over. That acknowledgement is a claim, not a receipt.","Old shares reconstruct only RMS N and become useless when epoch N+1 commits. The replacement delivery ceremonies are still required."],
  inside:[["split","secret, threshold 2, n 3"],["verify after rotation","reconstruct fresh shares == RMS N+1"],["share 1","cloud provider backup"],["share 2","server, gated by a FIDO2 credential"],["share 3","trusted contact"],["reconstruct","any 2 shares + MAC check"]] },

  cond:["Needs a physically connected USB/NFC key. There is no platform-authenticator fallback on desktop."],
  inside:[["get_webauthn_config","fetch the deployment's real rp origin"],["register/start","server challenge"],["clientDataJSON","built here, not by a browser"],["CTAP2","talk to the key over USB/NFC"],["register/finish","relay envelope + attestation"]] },

{ id:"WBS", key:"B", label:"Ephemeral web session", group:"server", gx:29, gy:4, w:2, d:2, h:2.8,

  what:["No-install, revocable browser access to a vault. A browser starts a session with its ephemeral public keys and the hash of a poll secret only it holds, shows a QR, and waits. An enrolled device of that account scans it and grants — choosing **read-only snapshot or live read-write**, and a TTL.",

  cond:["A live read-write session hands per-chunk vault keys to a browser tab. That is the point, and it is also the largest deliberate exposure in the system — hence the TTL and the one-click revoke.","Any RMS rotation makes the token epoch stale and middleware rejects it, even before normal TTL expiry."],
  inside:[["post_start","ephemeral ek/vk + poll-secret hash"],["QR","session id shown to the granting device"],["get_session","polled with the secret only the browser holds"],["post_grant","mode + ttl + key_epoch; capsule sealed to the ek"],["post_token","ephemeral proof → scoped, epoch-bound PASETO"],["middleware","web token epoch must equal account epoch"],["delete_session","revoke from any device"]] },

{ id:"IPC", key:"IPC", label:"IPC socket server", group:"clients", gx:-1, gy:4, w:2, d:2, h:3.2,

        "Three things must hold before a plaintext credential leaves: the connection came from a browser-spawned VELA host binary (kernel-verified), the user proved presence where the platform can ask, and the per-unlock domain budget is not spent. The release is recorded with the caller's pid, an audit entry names caller and domain, and a toast says so on screen."],

/* ══════════════════════════════════════════════════════════════════════
   GEOMETRY — isometric projection
   ══════════════════════════════════════════════════════════════════════ */
const TW = 34, TH = 17, ZU = 15;
const iso = (gx, gy, gz) => ({ x:(gx - gy) * TW, y:(gx + gy) * TH - (gz || 0) * ZU });

const cam = { x:0, y:0, s:1 };
const W2S = p => ({ x: cam.x + p.x * cam.s, y: cam.y + p.y * cam.s });
const G2S = (gx, gy, gz) => W2S(iso(gx, gy, gz));

const state = {
  hover:null, sel:null, selKind:null,      /* 'node' | 'flow' */
  flow:null, inside:null, tab:"what",
  playing:true, packets:[], picked:null, t0:performance.now(),
};

/* per-node route cache */
FLOWS.forEach((f, fi) => f.hops.forEach((h, hi) => {
  const A = NODE[h.a], B = NODE[h.b];
  const c1 = { x:A.gx + A.w/2, y:A.gy + A.d/2 };
  const c2 = { x:B.gx + B.w/2, y:B.gy + B.d/2 };
  h.route = h.bend === "d" ? [c1, c2]
          : h.bend === "y" ? [c1, { x:c1.x, y:c2.y }, c2]
          :                  [c1, { x:c2.x, y:c1.y }, c2];
  h.len = 0;
  for (let i = 1; i < h.route.length; i++)
    h.len += Math.hypot(h.route[i].x - h.route[i-1].x, h.route[i].y - h.route[i-1].y);
  h.fi = fi; h.hi = hi;
}));

function pointOn(hop, t) {
  const r = hop.route; let want = t * hop.len;
  for (let i = 1; i < r.length; i++) {
    const seg = Math.hypot(r[i].x - r[i-1].x, r[i].y - r[i-1].y);
    if (want <= seg || i === r.length - 1) {
      const k = seg === 0 ? 0 : Math.min(1, want / seg);
      return { x:r[i-1].x + (r[i].x - r[i-1].x) * k, y:r[i-1].y + (r[i].y - r[i-1].y) * k };
    }
    want -= seg;
  }
  return r[r.length - 1];
}

/* which flows touch a node */
const flowsOf = id => FLOWS.filter(f => f.hops.some(h => h.a === id || h.b === id));

/* ══════════════════════════════════════════════════════════════════════
   CANVAS
   ══════════════════════════════════════════════════════════════════════ */
const cvs = document.getElementById("scene");
const ctx = cvs.getContext("2d");
const INK = "#16160f", PAPER = "#cfc9a1";
let DPR = 1, VW = 0, VH = 0;

function hatch(kind) {
  const s = 7, c = document.createElement("canvas");
  c.width = c.height = s;
  const g = c.getContext("2d");
  g.strokeStyle = "rgba(22,22,15,.42)"; g.lineWidth = .8;
  g.beginPath();
  if (kind === "l") { g.moveTo(0, s); g.lineTo(s, 0); g.moveTo(-1, 1); g.lineTo(1, -1); g.moveTo(s-1, s+1); g.lineTo(s+1, s-1); }
  else if (kind === "r") { g.moveTo(0, 0); g.lineTo(s, s); g.moveTo(-1, s-1); g.lineTo(1, s+1); g.moveTo(s-1, -1); g.lineTo(s+1, 1); }
  else { g.moveTo(0, 3.5); g.lineTo(s, 3.5); }
  g.stroke();
  return ctx.createPattern(c, "repeat");
}
let HL, HR, HT;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const r = cvs.getBoundingClientRect();
  VW = r.width; VH = r.height;
  cvs.width = Math.round(VW * DPR); cvs.height = Math.round(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HL = hatch("l"); HR = hatch("r"); HT = hatch("t");
}

/* boxes for the current scene: the map, or the interior of one node */
function sceneBoxes() {
  if (!state.inside) return NODES.map(n => ({ ...n, ref:n }));
  const n = state.inside, steps = n.inside || [];
  return steps.map((s, i) => ({
    id:"step" + i, key:String(i + 1), label:s[0], note:s[1],
    gx:i * 4, gy:0, w:3, d:2, h:1.1 + (i % 3) * .5, step:true,
  }));
}
function sceneRoads() {
  if (!state.inside) {
    const out = [];
    FLOWS.forEach(f => f.hops.forEach(h => out.push({ hop:h, flow:f })));
    return out;
  }
  const b = sceneBoxes(), out = [];
  for (let i = 1; i < b.length; i++) {
    const c1 = { x:b[i-1].gx + b[i-1].w/2, y:b[i-1].gy + b[i-1].d/2 };
    const c2 = { x:b[i].gx + b[i].w/2, y:b[i].gy + b[i].d/2 };
    const hop = { route:[c1, c2], len:Math.hypot(c2.x - c1.x, c2.y - c1.y), interior:true, idx:i - 1 };
    out.push({ hop, flow:null });
  }
  return out;
}

function corners(b) {
  const { gx, gy, w, d, h } = b;
  return {
    A:iso(gx, gy, h), B:iso(gx + w, gy, h), C:iso(gx + w, gy + d, h), D:iso(gx, gy + d, h),
    A0:iso(gx, gy, 0), B0:iso(gx + w, gy, 0), C0:iso(gx + w, gy + d, 0), D0:iso(gx, gy + d, 0),
  };
}
function silhouette(b) {
  const c = corners(b);
  return [c.A, c.B, c.B0, c.C0, c.D0, c.D].map(W2S);
}
function pip(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], c = poly[j];
    if ((a.y > pt.y) !== (c.y > pt.y) && pt.x < (c.x - a.x) * (pt.y - a.y) / (c.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}

function path(pts, close) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  if (close) ctx.closePath();
}

function drawBox(b, mode) {
  const c = corners(b);
  const S = o => W2S(o);
  const top   = [c.A, c.B, c.C, c.D].map(S);
  const right = [c.B, c.C, c.C0, c.B0].map(S);
  const left  = [c.D, c.C, c.C0, c.D0].map(S);
  const dim = mode === "dim", hot = mode === "hot", sel = mode === "sel";

  ctx.save();
  if (dim) ctx.globalAlpha = .42;

  /* left face */
  path(left, true); ctx.fillStyle = PAPER; ctx.fill();
  if (!dim) { ctx.save(); ctx.clip(); ctx.fillStyle = HL; path(left, true); ctx.fill(); ctx.restore(); }
  /* right face */
  path(right, true); ctx.fillStyle = PAPER; ctx.fill();
  if (!dim) { ctx.save(); ctx.clip(); ctx.fillStyle = HR; path(right, true); ctx.fill(); ctx.restore(); }
  /* top face */
  path(top, true);
  ctx.fillStyle = sel ? INK : PAPER; ctx.fill();
  if (!dim && !sel) { ctx.save(); ctx.clip(); ctx.globalAlpha = .55; ctx.fillStyle = HT; path(top, true); ctx.fill(); ctx.restore(); }

  /* edges */
  ctx.strokeStyle = INK; ctx.lineWidth = hot || sel ? 1.7 : 1;
  path(left, true); ctx.stroke();
  path(right, true); ctx.stroke();
  path(top, true); ctx.stroke();
  ctx.restore();

  /* key letter on the roof */
  const mid = W2S({ x:(c.A.x + c.C.x) / 2, y:(c.A.y + c.C.y) / 2 });
  const fs = Math.max(7, Math.min(13, 10 * cam.s));
  if (fs > 6.5) {
    ctx.save();
    ctx.font = `500 ${fs}px "Berkeley Mono", ui-monospace, Menlo, monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (!sel) { ctx.fillStyle = PAPER; ctx.globalAlpha = .8;
      ctx.fillText(b.key, mid.x, mid.y + .5); ctx.globalAlpha = 1; }
    ctx.fillStyle = sel ? PAPER : INK;
    if (dim) ctx.globalAlpha = .5;
    ctx.fillText(b.key, mid.x, mid.y);
    ctx.restore();
  }
}

function boxLabel(b) {
  const c = corners(b);
  const p = W2S({ x:(c.A.x + c.B.x) / 2, y:Math.min(c.A.y, c.B.y) - 8 });
  const txt = (b.label || "").toUpperCase();
  ctx.save();
  ctx.font = `500 10px "Berkeley Mono", ui-monospace, Menlo, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  const w = ctx.measureText(txt).width;
  ctx.fillStyle = PAPER; ctx.fillRect(p.x - w/2 - 4, p.y - 12, w + 8, 14);
  ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.strokeRect(p.x - w/2 - 4, p.y - 12, w + 8, 14);
  ctx.fillStyle = INK; ctx.fillText(txt, p.x, p.y);
  ctx.restore();
}

function drawGrid() {
  const boxes = sceneBoxes();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  boxes.forEach(b => { x0 = Math.min(x0, b.gx); x1 = Math.max(x1, b.gx + b.w); y0 = Math.min(y0, b.gy); y1 = Math.max(y1, b.gy + b.d); });
  x0 -= 3; y0 -= 3; x1 += 3; y1 += 3;
  ctx.save(); ctx.strokeStyle = "rgba(22,22,15,.11)"; ctx.lineWidth = 1;
  for (let x = Math.floor(x0); x <= x1; x += 2) { const a = G2S(x, y0, 0), b = G2S(x, y1, 0); path([a, b]); ctx.stroke(); }
  for (let y = Math.floor(y0); y <= y1; y += 2) { const a = G2S(x0, y, 0), b = G2S(x1, y, 0); path([a, b]); ctx.stroke(); }
  ctx.restore();
}

function drawRoads() {
  const roads = sceneRoads();
  roads.forEach(r => {
    const active = state.inside ? true
      : (state.flow ? r.flow === state.flow
        : (state.sel && state.selKind === "node" ? (r.hop.a === state.sel || r.hop.b === state.sel) : false));
    const anySel = state.flow || (state.sel && state.selKind === "node");
    const pts = r.hop.route.map(p => G2S(p.x, p.y, 0));
    ctx.save();
    ctx.lineJoin = "round";
    if (r.hop.oob || (r.flow && r.flow.hops[r.hop.hi] && r.flow.hops[r.hop.hi].oob)) ctx.setLineDash([5, 4]);
    if (active) { ctx.strokeStyle = INK; ctx.lineWidth = 2.1; }
    else if (anySel) { ctx.strokeStyle = "rgba(22,22,15,.17)"; ctx.lineWidth = 1; }
    else { ctx.strokeStyle = "rgba(22,22,15,.42)"; ctx.lineWidth = 1.2; }
    path(pts); ctx.stroke();
    ctx.setLineDash([]);
    /* diamond at the bend */
    if (pts.length === 3 && (active || !anySel)) {
      const m = pts[1], s = active ? 3.4 : 2.6;
      ctx.fillStyle = INK;
      path([{x:m.x, y:m.y-s}, {x:m.x+s, y:m.y}, {x:m.x, y:m.y+s}, {x:m.x-s, y:m.y}], true);
      ctx.fill();
    }
    ctx.restore();
  });
}

/* ══════════════════════════════════════════════════════════════════════
   PACKETS
   ══════════════════════════════════════════════════════════════════════ */
const SPEED = 5.2;                                  /* grid units / second */
state.packets = FLOWS.map((f, i) => ({ fi:i, hi:0, t:0, wait:i * .55 }));
let iPacket = { idx:0, t:0, wait:0 };

function advance(dt) {
  state.packets.forEach(pk => {
    if (state.picked === pk) return;
    if (pk.wait > 0) { pk.wait -= dt; return; }
    const hop = FLOWS[pk.fi].hops[pk.hi];
    pk.t += dt * SPEED / Math.max(.4, hop.len);
    if (pk.t >= 1) {
      pk.t = 0; pk.hi++;
      if (pk.hi >= FLOWS[pk.fi].hops.length) { pk.hi = 0; pk.wait = 1.4; }
    }
  });
  const roads = sceneRoads();
  if (state.inside && roads.length) {
    if (iPacket.wait > 0) iPacket.wait -= dt;
    else {
      const h = roads[Math.min(iPacket.idx, roads.length - 1)].hop;
      iPacket.t += dt * SPEED / Math.max(.4, h.len);
      if (iPacket.t >= 1) { iPacket.t = 0; iPacket.idx++; if (iPacket.idx >= roads.length) { iPacket.idx = 0; iPacket.wait = 1; } }
    }
  }
}
function stepOnce() {
  state.packets.forEach(pk => {
    pk.wait = 0; pk.t = 0; pk.hi++;
    if (pk.hi >= FLOWS[pk.fi].hops.length) pk.hi = 0;
  });
  if (state.picked) syncInspector();
}
function packetScreen(pk) {
  const hop = FLOWS[pk.fi].hops[pk.hi];
  const g = pointOn(hop, pk.t);
  return { s:G2S(g.x, g.y, .28), hop };
}
function drawPackets() {
  if (state.inside) {
    const roads = sceneRoads();
    if (!roads.length) return;
    const h = roads[Math.min(iPacket.idx, roads.length - 1)].hop;
    const g = pointOn(h, iPacket.t), s = G2S(g.x, g.y, .28);
    ctx.save(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(s.x, s.y, 4.2, 0, 7); ctx.fill();
    ctx.strokeStyle = PAPER; ctx.lineWidth = 1.4; ctx.stroke(); ctx.restore();
    return;
  }
  state.packets.forEach(pk => {
    const f = FLOWS[pk.fi];
    const muted = state.flow && state.flow !== f;
    if (pk.wait > 0 && !state.picked) return;
    const { s } = packetScreen(pk);
    const on = state.picked === pk;
    ctx.save();
    ctx.globalAlpha = muted ? .3 : 1;
    if (on) {
      ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
      ctx.strokeRect(s.x - 8.5, s.y - 8.5, 17, 17);
    }
    ctx.beginPath(); ctx.arc(s.x, s.y, on ? 5.4 : 4, 0, 7);
    ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = PAPER; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  });
}

/* ══════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════ */
function render() {
  ctx.clearRect(0, 0, VW, VH);
  drawGrid();
  drawRoads();

  const boxes = sceneBoxes().slice().sort((a, b) =>
    (a.gx + a.w/2 + a.gy + a.d/2) - (b.gx + b.w/2 + b.gy + b.d/2));

  const flowIds = state.flow ? new Set(state.flow.hops.flatMap(h => [h.a, h.b])) : null;
  boxes.forEach(b => {
    let mode = "";
    if (state.inside) mode = (state.hover && state.hover.id === b.id) ? "hot" : "";
    else {
      if (flowIds && !flowIds.has(b.id)) mode = "dim";
      if (state.sel === b.id && state.selKind === "node") mode = "sel";
      else if (state.hover && state.hover.id === b.id) mode = "hot";
    }
    drawBox(b, mode);
  });

  drawPackets();

  boxes.forEach(b => {
    const show = (state.hover && state.hover.id === b.id) ||
                 (!state.inside && state.sel === b.id && state.selKind === "node");
    if (show) boxLabel(b);
  });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state.playing) advance(dt);
  render();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════════
   VIEW CONTROL
   ══════════════════════════════════════════════════════════════════════ */
function fit(pad) {
  const boxes = sceneBoxes();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  boxes.forEach(b => {
    const c = corners(b);
    [c.A, c.B, c.C, c.D, c.A0, c.B0, c.C0, c.D0].forEach(p => {
      x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
      y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
    });
  });
  const m = pad === undefined ? 48 : pad;
  const s = Math.min((VW - m * 2) / (x1 - x0), (VH - m * 2) / (y1 - y0));
  cam.s = Math.max(.25, Math.min(2.4, s));
  cam.x = VW / 2 - (x0 + x1) / 2 * cam.s;
  cam.y = VH / 2 - (y0 + y1) / 2 * cam.s;
}
function centerOn(n, zoom) {
  const c = corners(n);
  const wx = (c.A.x + c.C.x) / 2, wy = (c.A.y + c.C0.y) / 2;
  if (zoom) cam.s = Math.max(cam.s, 1.15);
  cam.x = VW / 2 - wx * cam.s;
  cam.y = VH / 2 - wy * cam.s;
}

/* ══════════════════════════════════════════════════════════════════════
   HIT TESTING
   ══════════════════════════════════════════════════════════════════════ */
function boxAt(pt) {
  const boxes = sceneBoxes().slice().sort((a, b) =>
    (b.gx + b.w/2 + b.gy + b.d/2) - (a.gx + a.w/2 + a.gy + a.d/2));
  for (const b of boxes) if (pip(pt, silhouette(b))) return b;
  return null;
}
function packetAt(pt) {
  if (state.inside) return null;
  let best = null, bd = 13;
  state.packets.forEach(pk => {
    if (pk.wait > 0 && state.picked !== pk) return;
    const { s } = packetScreen(pk);
    const d = Math.hypot(s.x - pt.x, s.y - pt.y);
    if (d < bd) { bd = d; best = pk; }
  });
  return best;
}

   TEXT
   ══════════════════════════════════════════════════════════════════════ */
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const fmt = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<span class="mk">$1</span>')
  .replace(/`([^`]+)`/g, '<span class="cd">$1</span>');
document.head.insertAdjacentHTML("beforeend",
  "<style>.cd{background:rgba(22,22,15,.09);padding:0 3px}</style>");

/* ══════════════════════════════════════════════════════════════════════
   RIGHT PANEL

const pb = document.getElementById("panelbody");

function renderPanel() {
  const tab = state.tab;
  let h = "";

  if (state.selKind === "flow" && state.flow) {
    const f = state.flow;
    h += `<h1>Traced flow</h1><h2>${esc(f.name)}</h2>
          <p class="sub">${f.hops.length} hops · click any dot on the map to read what is on that wire</p>`;
    h += `<h3>The hops</h3>`;

          <p class="sub">${n.files.length} file${n.files.length > 1 ? "s" : ""} · ${flowsOf(n.id).length} flow${flowsOf(n.id).length === 1 ? "" : "s"} pass through</p>`;
    if (tab === "what") {

      }

      flowsOf(n.id).forEach(f => h += `<span class="chip" data-flow="${f.id}">${esc(f.short)}</span>`);
      if (n.inside && n.inside.length)
        h += `<h3>Inside</h3><div class="go" data-inside="${n.id}">&rarr; goes inside — ${n.inside.length} steps in execution order</div>`;
    } else {
      h += `<h3>How it's built</h3>`;
      n.built.forEach(p => h += `<p>${fmt(p)}</p>`);
      h += `<h3>Where it lives</h3>`;
      n.files.forEach(f => h += `<div class="file">${esc(f)}</div>`);
      if (n.inside && n.inside.length) {
        h += `<h3>Steps</h3><table>`;
        n.inside.forEach(s => h += `<tr><td class="k">${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`);
        h += `</table><div class="go" data-inside="${n.id}">&rarr; goes inside</div>`;
      }
    }
  } else {
    h += `<h1>VELA</h1><h2>${esc(OVERVIEW.title)}</h2><p class="sub">${esc(OVERVIEW.sub)}</p>`;
    if (tab === "what") {
      h += `<h3>What this is</h3>`;
      OVERVIEW.what.forEach(p => h += `<p>${fmt(p)}</p>`);
      h += `<h3>How to read it</h3>
        <p>Hover anything for a plain description. Height means authority: the <span class="mk">tall structures decide</span> something — what is allowed, what is fresh, who is asking — and the flat slabs store something.</p>
        <p>The moving dots are real payloads. <span class="mk">Click one</span> to read the exact bytes on that wire and the file that puts them there. <span class="mk">&rarr; goes inside</span> a structure to see its steps in execution order.</p>
        <h3>Traced flows</h3>`;
      FLOWS.forEach(f => h += `<span class="chip" data-flow="${f.id}">${esc(f.short)}</span>`);
    } else {
      OVERVIEW.built.forEach(p => h += `<p>${fmt(p)}</p>`);
      h += `<h3>Condition</h3>`;
      OVERVIEW.cond.forEach(c => h += `<div class="cond">${fmt(c)}</div>`);
      h += `<h3>The tree</h3>
        <table>
          <tr><td class="k">libVELA/vela-crypto</td><td>4,006 lines · every primitive</td></tr>
          <tr><td class="k">libVELA/vela-core</td><td>2,275 lines · platform-neutral vault</td></tr>
          <tr><td class="k">libVELA/vela-{android,apple,wasm}-bridge</td><td>3,280 lines · one core, four runtimes</td></tr>
          <tr><td class="k">desktopVELA/vela-desktop-core</td><td>35,213 lines · the client brain</td></tr>
          <tr><td class="k">desktopVELA/src-tauri</td><td>1,720 lines · 47 commands</td></tr>
          <tr><td class="k">desktopVELA/src-gpui</td><td>19,483 lines · the second front end</td></tr>
          <tr><td class="k">serverVELA/vela-server</td><td>15,708 lines · 54 routes</td></tr>
          <tr><td class="k">extension</td><td>3,871 lines · mv3 + native host</td></tr>
          <tr><td class="k">androidVELA · iosVELA · webVELA</td><td>the other three clients</td></tr>
        </table>`;
    }
  }
  pb.innerHTML = h;
  pb.scrollTop = 0;
  pb.querySelectorAll("[data-node]").forEach(el => el.onclick = () => selectNode(el.dataset.node, true));
  pb.querySelectorAll("[data-flow]").forEach(el => el.onclick = () => selectFlow(FLOWS.find(f => f.id === el.dataset.flow)));
  pb.querySelectorAll("[data-inside]").forEach(el => el.onclick = () => enterInside(NODE[el.dataset.inside]));
  pb.querySelectorAll("[data-hop]").forEach(el => el.onclick = () => {
    const pk = state.packets[FLOWS.indexOf(state.flow)];
    pk.hi = +el.dataset.hop; pk.t = .5; pk.wait = 0;
    pick(pk);
  });
}

/* ══════════════════════════════════════════════════════════════════════
   SELECTION
   ══════════════════════════════════════════════════════════════════════ */
function selectNode(id, center) {
  state.sel = id; state.selKind = "node"; state.flow = null;
  if (center && NODE[id]) centerOn(NODE[id], false);
  markSidebar(); renderPanel(); breadcrumb();
}
function selectFlow(f) {
  if (!f) return;
  state.flow = f; state.selKind = "flow"; state.sel = null;
  markSidebar(); renderPanel(); breadcrumb();
}
function clearSel() {
  state.sel = null; state.selKind = null; state.flow = null;
  markSidebar(); renderPanel(); breadcrumb();
}
function enterInside(n) {
  if (!n || !n.inside || !n.inside.length) return;
  state.inside = n; iPacket = { idx:0, t:0, wait:0 };
  state.sel = n.id; state.selKind = "node"; state.flow = null;
  fit(90); renderPanel(); breadcrumb(); markSidebar();
}
function exitInside() {
  if (!state.inside) return;
  const n = state.inside; state.inside = null;
  fit(); centerOn(n, false); renderPanel(); breadcrumb();
}
function breadcrumb() {
  const el = document.getElementById("breadcrumb");
  el.textContent = state.inside
    ? "vela / " + state.inside.label + " / inside — ← to come back out"
    : (state.selKind === "flow" && state.flow ? "vela / flow / " + state.flow.name
      : (state.sel ? "vela / " + NODE[state.sel].label : "vela / the map"));
}

/* ══════════════════════════════════════════════════════════════════════
   PACKET INSPECTOR
   ══════════════════════════════════════════════════════════════════════ */
const insp = document.getElementById("inspector");
function pick(pk) {
  state.picked = pk;
  state.playing = false; syncPlayBtn();
  insp.classList.add("open");
  syncInspector();
}
function closeInspector() {
  state.picked = null; insp.classList.remove("open");
}
function syncInspector() {
  const pk = state.picked; if (!pk) return;
  const f = FLOWS[pk.fi], hop = f.hops[pk.hi], p = hop.p;
  document.getElementById("insp-route").innerHTML =
    `${esc(f.short)} &nbsp;·&nbsp; hop ${pk.hi + 1}/${f.hops.length} &nbsp;·&nbsp; ` +
    `${esc(NODE[hop.a].label)} &rarr; ${esc(NODE[hop.b].label)}`;
  document.getElementById("insp-title").textContent = p.t;
  document.getElementById("insp-body").textContent = p.body;
  const note = document.getElementById("insp-note");
  note.innerHTML = p.note ? fmt(p.note) : "";
  document.getElementById("insp-src").textContent = (p.kind ? p.kind + "  ·  " : "") + (p.src || "");
}
function hopStep(d) {
  const pk = state.picked; if (!pk) return;
  const n = FLOWS[pk.fi].hops.length;
  pk.hi = (pk.hi + d + n) % n; pk.t = .5;
  syncInspector();
}
document.getElementById("insp-close").onclick = closeInspector;
document.getElementById("insp-prev").onclick = () => hopStep(-1);
document.getElementById("insp-next").onclick = () => hopStep(1);
document.getElementById("insp-flow").onclick = () => {
  if (state.picked) selectFlow(FLOWS[state.picked.fi]);
};

/* ══════════════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════════════ */
const tip = document.getElementById("tip");
const stage = document.getElementById("stage");
let drag = null, moved = 0;

function localPt(e) {
  const r = cvs.getBoundingClientRect();
  return { x:e.clientX - r.left, y:e.clientY - r.top };
}

cvs.addEventListener("mousemove", e => {
  const pt = localPt(e);
  if (drag) {
    cam.x += pt.x - drag.x; cam.y += pt.y - drag.y;
    moved += Math.abs(pt.x - drag.x) + Math.abs(pt.y - drag.y);
    drag = pt; tip.style.display = "none";
    return;
  }
  const pk = packetAt(pt);
  const b = pk ? null : boxAt(pt);
  state.hover = b;
  cvs.style.cursor = (pk || b) ? "pointer" : "grab";

  if (pk) {
    const f = FLOWS[pk.fi], hop = f.hops[pk.hi];
    showTip(pt, f.short + " · " + hop.p.kind, hop.p.t + " — click to inspect");
  } else if (b) {
    const src = state.inside ? { t:b.label, d:b.note }
      : { t:b.label, d:(b.ref ? b.ref.what[0].replace(/\*\*/g, "").split(". ")[0] + "." : "") };
    showTip(pt, src.t, src.d);
  } else tip.style.display = "none";
});
function showTip(pt, title, desc) {
  tip.innerHTML = `<div class="t">${esc(title)}</div>` + (desc ? `<div class="d">${esc(desc)}</div>` : "");
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(pt.x + 16, stage.clientWidth - w - 8) + "px";
  tip.style.top = Math.max(6, Math.min(pt.y + 16, stage.clientHeight - h - 30)) + "px";
}
cvs.addEventListener("mouseleave", () => { tip.style.display = "none"; state.hover = null; });
cvs.addEventListener("mousedown", e => { drag = localPt(e); moved = 0; cvs.classList.add("drag"); });
window.addEventListener("mouseup", e => {
  if (drag && moved < 4) {
    const pt = localPt(e);
    const pk = packetAt(pt);
    if (pk) pick(pk);
    else {
      const b = boxAt(pt);
      if (b && !state.inside) { closeInspector(); selectNode(b.id, false); }
      else if (b && state.inside) { showTip(pt, b.label, b.note); }
      else { closeInspector(); if (!state.inside) clearSel(); }
    }
  }
  drag = null; cvs.classList.remove("drag");
});
cvs.addEventListener("dblclick", e => {
  const b = boxAt(localPt(e));
  if (b && !state.inside && b.ref) enterInside(b.ref);
});
cvs.addEventListener("wheel", e => {
  e.preventDefault();
  const pt = localPt(e);
  const k = Math.exp(-e.deltaY * .0016);
  const ns = Math.max(.22, Math.min(3.2, cam.s * k));
  cam.x = pt.x - (pt.x - cam.x) * (ns / cam.s);
  cam.y = pt.y - (pt.y - cam.y) * (ns / cam.s);
  cam.s = ns;
}, { passive:false });

document.querySelectorAll(".zb").forEach(b => b.onclick = () => {
  const k = b.dataset.z === "in" ? 1.25 : .8;
  const ns = Math.max(.22, Math.min(3.2, cam.s * k));
  cam.x = VW/2 - (VW/2 - cam.x) * (ns / cam.s);
  cam.y = VH/2 - (VH/2 - cam.y) * (ns / cam.s);
  cam.s = ns;
});

/* tabs */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  state.tab = t.dataset.tab; renderPanel();
});

/* transport */
function syncPlayBtn() {
  const b = document.getElementById("btn-play");
  b.classList.toggle("on", state.playing);
  b.innerHTML = state.playing ? "&#10073;&#10073; Pause the flow" : "&#9654; Resume the flow";
}
document.getElementById("btn-play").onclick = () => { state.playing = !state.playing; syncPlayBtn(); };
document.getElementById("btn-step").onclick = () => { state.playing = false; syncPlayBtn(); stepOnce(); };
document.getElementById("btn-reset").onclick = () => { state.inside = null; clearSel(); closeInspector(); fit(); breadcrumb(); renderPanel(); };

/* keyboard */
const ORDER = NODES.map(n => n.id);
window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (state.picked) closeInspector();
    else if (state.inside) exitInside();
    else clearSel();
    return;
  }
  if (e.key === "ArrowRight") {
    if (state.picked) { hopStep(1); return; }
    if (!state.inside && state.sel) enterInside(NODE[state.sel]);
    e.preventDefault(); return;
  }
  if (e.key === "ArrowLeft") {
    if (state.picked) { hopStep(-1); return; }
    exitInside(); e.preventDefault(); return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (state.inside) return;
    const i = ORDER.indexOf(state.sel);
    const j = (i + (e.key === "ArrowDown" ? 1 : -1) + ORDER.length) % ORDER.length;
    selectNode(ORDER[i === -1 ? 0 : j], true);
    return;
  }
  if (e.key === " ") { e.preventDefault(); state.playing = !state.playing; syncPlayBtn(); }
  if (e.key === "." ) { state.playing = false; syncPlayBtn(); stepOnce(); }
});

/* ══════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════ */
window.addEventListener("resize", () => { resize(); });
resize();
buildSidebar();
renderPanel();
breadcrumb();
fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
