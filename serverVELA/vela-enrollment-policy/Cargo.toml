[package]
name = "vela-enrollment-policy"
version = "0.1.0"
edition = "2021"
description = "Pure, formally verified policy for VELA device enrollment ceremonies"
license = "MIT OR Apache-2.0"

[lib]
name = "vela_enrollment_policy"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(hax)'.dependencies]
hax-lib = "=0.3.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hax)", "cfg(hax_compilation)"] }
