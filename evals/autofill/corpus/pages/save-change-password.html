<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme Bank – Change password</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Change password</h1>
<form id="change" method="post" action="/api/site?outcome=ok">
  <label for="account">Account</label><input id="account" name="account" type="text" autocomplete="username" value="alice@acme-bank.test" readonly>
  <label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password">
  <label for="new1">New password</label><input id="new1" name="new1" type="password" autocomplete="new-password">
  <label for="new2">Repeat new password</label><input id="new2" name="new2" type="password" autocomplete="new-password">
  <button id="update" type="submit">Update password</button>
</form></body></html>
