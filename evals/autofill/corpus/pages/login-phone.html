<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Login</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Log in with your phone</h1>
<form method="post" action="/api/login">
  <label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel">
  <label for="password">Password</label><input id="password" name="password" type="password">
  <button>Log in</button>
</form></body></html>
