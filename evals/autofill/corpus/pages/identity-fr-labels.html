<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livraison</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Adresse de livraison</h1>
<form method="post" action="/api/livraison">
  <label for="prenom">Prénom</label><input id="prenom" name="prenom">
  <label for="nom">Nom</label><input id="nom" name="nom">
  <label for="adresse">Adresse</label><input id="adresse" name="adresse">
  <label for="cp">Code postal</label><input id="cp" name="code_postal">
  <label for="ville">Ville</label><input id="ville" name="ville">
  <label for="tel">Téléphone</label><input id="tel" name="telephone" type="tel">
  <button>Valider</button>
</form></body></html>
