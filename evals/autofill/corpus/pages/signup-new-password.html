<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme Bank – Create account</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Create your account</h1>
<form method="post" action="/api/signup">
  <label for="su-email">Email</label><input id="su-email" name="email" type="email" autocomplete="email">
  <label for="new-password">Password</label><input id="new-password" name="password" type="password" autocomplete="new-password">
  <label for="confirm-password">Confirm password</label><input id="confirm-password" name="password2" type="password" autocomplete="new-password">
  <button>Create account</button>
</form></body></html>
