<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme Bank – Sign in</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Sign in to Acme Bank</h1>
<form id="login" method="post" action="/api/login">
  <label for="username">Email</label><input id="username" name="username" type="email" autocomplete="username">
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
</form></body></html>
