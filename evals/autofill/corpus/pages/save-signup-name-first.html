<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop New – Create account</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Create your account</h1>
<form id="signup" method="post" action="/api/site?outcome=ok">
  <label for="fullname">Full name</label><input id="fullname" name="fullname" type="text" autocomplete="name">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email">
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password">
  <label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password">
  <button id="create" type="submit">Create account</button>
</form></body></html>
