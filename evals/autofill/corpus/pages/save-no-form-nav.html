<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop New – Sign in</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Sign in</h1>
<div class="login-box">
  <label for="user">Username</label><input id="user" type="text">
  <label for="pass">Password</label><input id="pass" type="password">
  <button id="go" type="button">Sign in</button>
</div>
<script>
document.getElementById("go").addEventListener("click", async () => {
  await fetch("/api/site?outcome=ok", { method: "POST", body: JSON.stringify({ u: document.getElementById("user").value, p: document.getElementById("pass").value }) });
  location.assign("/landed");
});
</script></body></html>
