<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/_style.css"></head><body>
<h1>Delivery details</h1>
<form method="post" action="/api/details">
  <label for="fname">First Name</label><input id="fname" name="fname">
  <label for="lname">Last Name</label><input id="lname" name="lname">
  <label for="addr1">Street address</label><input id="addr1" name="addr1">
  <label for="town">Town / City</label><input id="town" name="town">

  <label for="mobile">Mobile</label><input id="mobile" name="mobile" type="tel">
  <button>Save</button>
</form></body></html>
