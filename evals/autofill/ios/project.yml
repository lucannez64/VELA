# XcodeGen spec for the iOS autofill eval:  cd evals/autofill/ios && xcodegen
# AutofillLab:        native forms (corpus/native-forms.json) + a WKWebView
# AutofillEvalUITests: drives Safari, the lab app and real apps with VELA as
#                     the AutoFill provider; results go to the eval server.
name: VELAAutofillEval
options:
  bundleIdPrefix: dev.vela.autofilleval
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(VELA_TEAM_ID)
targets:
  AutofillLab:
    type: application
    platform: iOS
    sources: [AutofillLab]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Autofill Lab
        UILaunchScreen: {}
        # Plain HTTP to the eval server on the Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        # Must match the lab-app login's appIds in corpus/vault.json.
        PRODUCT_BUNDLE_IDENTIFIER: dev.vela.autofilleval.lab
  AutofillEvalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vela.autofilleval.uitests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: AutofillLab
schemes:
  AutofillEval:
    build:
      targets:
        AutofillLab: all
        AutofillEvalUITests: [test]
    test:
      config: Debug
      targets: [AutofillEvalUITests]
